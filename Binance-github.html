      .filter(e=>{   // 同币同向同分钟去重(与回放事件合并防重)
        const k = e.sym + "|" + e.side + "|" + Math.floor(e.ts / 60000);
        if (seenKey.has(k)) return false;
        seenKey.add(k); return true;
      });
    if (pinEvents.length > PIN_MAX_EVENTS) pinEvents = trimPinEvents(pinEvents);   // loadPinEvents 恢复也走保护裁剪
  }catch(_){}
  pinDedupEvents();   // 跨机制去重(清理历史遗留的重复)
}
/* ★第八轮③(2026-10-29): 统一裁剪入口——裸 slice 会把头部 pending(黄卡)裁掉而 st.pendingLow/High 仍引用孤儿对象:
   updPend 继续刷"不在数组"的对象→黄卡蒸发+fire 转正走 pend 分支不 push→响铃却无卡片。 */
function trimPinEvents(arr){
  /* pending(黄卡)保住: 裁剪前先把当前挂卡对象塞回队尾, 再 slice */
  const keepPending = [];
  pinState.forEach(ss=>{
    if (ss.pendingLow  && ss.pendingLow.status  === "pending") keepPending.push(ss.pendingLow);
    if (ss.pendingHigh && ss.pendingHigh.status === "pending") keepPending.push(ss.pendingHigh);
  });
  let list = arr.slice(-PIN_MAX_EVENTS);
  keepPending.forEach(pe=>{
    if (!list.includes(pe)) list.push(pe);   // 被裁掉的黄卡补回尾部
  });
  return list;
}
/* 跨机制去重: 回放/存档/实时三套来源可能各记一条同一根针(同币同向15分钟内必为重复,
   分方向冷却保证运行期同向独立针间隔≥15分钟) → 合并保留优先级高的一条(实时>存档>回放) */
function pinDedupEvents(){
  const pr = e => e.restored ? 2 : (e.replay ? 3 : 1);
  const sorted = pinEvents.slice().sort((a,b)=>{
    const pa = pr(a), pb = pr(b);
    if (pa !== pb) return pa - pb;
    return b.ts - a.ts;
  });
  /* ★v5 P2 守卫: 保挂卡——被 st.pendingLow/High 引用的 pending 活卡不许被重复项顶掉(与 trimPinEvents keepPending 同款)。
     P1 判灰的 P(restored=2) 会先入 kept; pinReplay 重造的 Q(replay=3, pending, st 挂它)后到时去重命中——
     旧版丢 Q → Q 成孤儿(st 指着它但不在数组), updPend 刷隐形卡、12min 清扫只灰隐形卡, 该币进行中黄卡整窗缺席。
     顶替语义: 活卡遇到重复项时替换掉已入 kept 的老记录——同一根针的状态从 failed 演进到 pending;
     顶替而非"两条都留"——同币同向同 ts 一张 failed 一张 pending 会让同根针渲染两卡, 用户视角"一根针两条记录"。 */
  const pinned = new Set();
  pinState.forEach(ss=>{
    if (ss.pendingLow  && ss.pendingLow.status  === "pending") pinned.add(ss.pendingLow);
    if (ss.pendingHigh && ss.pendingHigh.status === "pending") pinned.add(ss.pendingHigh);
  });
  const kept = [];
  sorted.forEach(ev=>{
    const idxDup = kept.findIndex(x=>x.sym === ev.sym && x.side === ev.side && Math.abs(x.ts - ev.ts) < PIN_COOLDOWN);
    if (idxDup >= 0){
      if (pinned.has(ev)) kept.splice(idxDup, 1);   // 活卡顶替重复项(P1 判灰的 P 在此退位)
      else return;                                   // 非活卡重复: 丢弃(原逻辑)
    }
    kept.push(ev);
  });
  if (kept.length !== pinEvents.length){ pinEvents = kept; savePinEvents(); }
}
const pinState = new Map();       // symbol -> {bars:[], atr, lastFireLow, lastFireHigh, firedLow, firedHigh}
const pinTrend = new Map();       // symbol -> {series:[{t,dir,deg}], ts:刷新时间}

/* ---------- 趋势引擎: 5m EMA200 单线斜率(角度制), 支持任意历史时刻回溯 ---------- */
function emaSeries(closes, n){   // 从头到尾的 EMA 序列(SMA seed)
  const k = 2/(n+1), out = [];
  if (closes.length < n) return out;
  let s = 0;
  for (let i = 0; i < closes.length; i++){
    if (i < n){ s += closes[i]; if (i === n-1) out.push(s/n); }
    else {
      const prev = out[out.length-1];
      out.push(closes[i]*k + prev*(1-k));
    }
  }
  return out;
}
/* 任意历史时刻查 {dir, deg}; series 元素 {t, dir, deg} */
function trendAt(sym, ts){
  const tr = pinTrend.get(sym);
  if (!tr || !tr.series || !tr.series.length) return {dir:"na", deg:0};
  let lo = 0, hi = tr.series.length - 1, ans = -1;
  while (lo <= hi){
    const m = (lo + hi) >> 1;
    if (tr.series[m].t <= ts){ ans = m; lo = m + 1; } else hi = m - 1;
  }
  return ans >= 0 ? tr.series[ans] : {dir:"na", deg:0};
}
/* ★ 六批⑦方案A(用户拍板): 趋势数据改"确认时回填"——黄卡出生不请求(有5m缓存就读没有就na),
   confirmed 时拉一份 15m(limit=30), EMA9/21 乖离判向(deg≥8), 同请求顺算 calcSLTP。
   缓存 pinTrend15 30min TTL; loadPinEvents 恢复时清 _fetching 防死锁; 回放事件不拉。 */
const pinTrend15 = new Map();     // sym -> {ts, dir, deg, atr15, bars15}
const T15_TTL = 30*60*1000;
async function fetchTrendConfirm(sym){
  const cached = pinTrend15.get(sym);
  if (cached && Date.now() - cached.ts < T15_TTL) return cached;
  const arr = await fapi(`/fapi/v1/klines?symbol=${encodeURIComponent(sym)}&interval=15m&limit=30`);
  if (!Array.isArray(arr) || arr.length < 26) return null;
  const bars = arr.map(k=>({ t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5] }));
  const closes = bars.map(b=>b.c);
  const ema = (p)=>{ const k = 2/(p+1); const out=[closes[0]]; let e=closes[0];
    for (let i=1;i<closes.length;i++){ e = closes[i]*k + e*(1-k); out.push(e); } return out; };
  const e9 = ema(9), e21 = ema(21);
  const last = closes.length - 1;
  const spread = (e9[last] - e21[last]) / e21[last] * 100;
  const deg = Math.atan(spread * 3) * 180 / Math.PI;
  const dir = deg >= 8 ? "up" : (deg <= -8 ? "down" : "flat");
  const info = { ts: Date.now(), dir, deg: Math.round(deg), atr15: calcATR(bars), bars15: bars, spread: Math.round(spread*100)/100 };
  pinTrend15.set(sym, info);
  return info;
}
/* ★ 六批⑪ calcSLTP(USER.md 规则优先, 评审 0.5×ATR 作废): SL=结构外±15m ATR×1.5; TP=事件前摆动位(15根×15m=3.75小时窗, 非24h, 也不是"15分钟")。
   防自证: bars15 先按 b.t+15m ≤ ev.ts 过滤(针后根不当结构点); 触发=确认时一次(同15m请求顺路算), 渲染不自动拉(防并发风暴)。 */
function calcSLTP(ev, info){
  try{
    if (!ev || ev._sltp || ev._fetching) return;
    if (!info || !Array.isArray(info.bars15) || info.bars15.length < 16 || !(info.atr15 > 0)) return;
    if (!(ev.px > 0) || !ev.tip) return;
    ev._fetching = true;
    const closed = info.bars15.filter(b => b.t + 15*60*1000 <= ev.ts);
    if (closed.length < PIN_SLTP_SWING_BARS) return;
    const window = closed.slice(-PIN_SLTP_SWING_BARS);   // 15根×15m=3.75小时(见 PIN_SLTP_SWING_BARS 注释)
    let swingLow = Infinity, swingHigh = -Infinity;
    window.forEach(b=>{ if (b.l < swingLow) swingLow = b.l; if (b.h > swingHigh) swingHigh = b.h; });
    if (!(isFinite(swingLow) && isFinite(swingHigh) && swingHigh > swingLow)) return;
    const buf = info.atr15 * 1.5;
    let sl, tp;
    if (ev.side === "sweep-low"){ sl = Math.min(ev.tip, swingLow) - buf; tp = swingHigh; }
    else                       { sl = Math.max(ev.tip, swingHigh) + buf; tp = swingLow; }
    const entry = ev.px;
    const risk = Math.abs(entry - sl), reward = Math.abs(tp - entry);
    if (!(risk > 0) || !(reward > 0)) return;
    ev._sltp = { sl: fmtPrice(sl), tp: fmtPrice(tp), rr: (reward/risk >= 0.05) ? (reward/risk).toFixed(2) : "—" };
  } finally { if (ev) ev._fetching = false; }
}
async function fetchTrend(sym){
  const arr = await fapi(`/fapi/v1/klines?symbol=${encodeURIComponent(sym)}&interval=${PIN_TREND_BAR}&limit=${PIN_TREND_KEEP}`);
  if (!Array.isArray(arr) || arr.length < PIN_TREND_EMA + PIN_TREND_LOOK + 10) return;
  const closes = arr.map(k=>+k[4]);
  const e200 = emaSeries(closes, PIN_TREND_EMA);
  if (e200.length <= PIN_TREND_LOOK) return;
  /* 每根已收盘 5m bar: θ = atan(近60根 EMA200 净位移% × K)·换算成度 */
  const n = arr.length;
  const series = [];
  for (let j = PIN_TREND_EMA - 1 + PIN_TREND_LOOK; j < n; j++){   // EMA seed 后再回看60根才有完整斜率
    const iNow = j - (PIN_TREND_EMA - 1);        // e200[i]↔bar(EMA-1+i)
    const iRef = iNow - PIN_TREND_LOOK;
    if (iRef < 0) continue;
    const a = e200[iNow], b = e200[iRef];
    if (!(b > 0)) continue;
    const t = +arr[j][0] + 5*60*1000;           // 5m bar 确认时刻(开盘+5m)
    const d = (a - b) / b * 100;                 // Δ%(近60根=5小时)
    const deg = Math.atan(d * PIN_TREND_K) * 180 / Math.PI;
    const dir = deg >= PIN_TREND_MIN ? "up" : (deg <= -PIN_TREND_MIN ? "down" : "flat");
    series.push({ t, dir, deg: Math.round(deg) });
  }
  pinTrend.set(sym, { series, ts: Date.now() });
  /* 回填: 趋势加载前发生的事件(含回放批)补上事件时刻的趋势 */
  let backfilled = false;
  pinEvents.forEach(ev=>{
    if (ev.sym === sym && (ev.trend === "na" || ev.trend === undefined)){ ev.trend = trendAt(sym, ev.ts).dir; backfilled = true; }
  });
  if (backfilled && curView === "pin") render();
}
function refreshAllTrends(){   // 分批刷新全部订阅币的 5m 趋势
  const syms = [...pinStreams].map(s=>s.split("@")[0].toUpperCase());
  syms.forEach((s, i)=>setTimeout(()=>fetchTrend(s), Math.floor(i/6)*300));
}

/* ---------- 核心状态 ---------- */
function pinEnsureState(sym){
  let st = pinState.get(sym);
  if (!st){
    st = { bars: [], atr: 0, lastFireLow: 0, lastFireHigh: 0, firedLow: 0, firedHigh: 0 };
    pinState.set(sym, st);
  }
  return st;
}
function calcATR(bars){   // ★ Median TR(六批④): 14 根 TR 排序取索引 6/7 平均 — 抗单根极端污染(旧均值版被插针拉偏)
  if (bars.length < 15) return 0;
  const trs = [];
  for (let i = bars.length - 14; i < bars.length; i++){
    const b = bars[i], p = bars[i-1] ? bars[i-1].c : b.o;
    // TR 兼容两种数据形态: 数组(REST/ws) 与 对象(cdp测试注入)
    const h = Array.isArray(b) ? +b[2] : b.h, l = Array.isArray(b) ? +b[3] : b.l,
          o = Array.isArray(b) ? +b[1] : b.o, cc = Array.isArray(b) ? +b[4] : b.c,
          pc = Array.isArray(b) ? (bars[i-1] ? (Array.isArray(bars[i-1]) ? +bars[i-1][4] : bars[i-1].c) : o) : p;
    trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
  }
  trs.sort((x, y) => x - y);
  return (trs[6] + trs[7]) / 2;
}

/* ---------- WS kline 流入口(未收盘K线每秒推送, x=true 表示该根收盘) ---------- */
function pinOnKline(sym, k){
  if (!k || !sym || !k.t) return;
  const st = pinEnsureState(sym);
  const o = +k.o, h = +k.h, l = +k.l, c = +k.c, v = +k.v, t = +k.t;
  if (!(o > 0 && h >= l && v >= 0)) return;
  pinCheck(sym, st, t, o, h, l, c, v, false);   // 实时 tick 级检测(含未收盘K线, 主/副连接各推一次均幂等)
  if (k.x){   // 收盘: 推入bars并更新ATR —— t 去重: 三条数据腿(主WS/副WS/REST修复)喂同一根只计一次
    if (!st.bars.some(b=>b.t === t)){
      st.bars.push({ t, o, h, l, c, v });
      if (st.bars.length > PIN_BARS_KEEP) st.bars.shift();
      st.atr = calcATR(st.bars);
    }
  }
}

/* ---------- 检测: 滑窗偏离 + 回归三态(🟡进行中 → ✅确认 / ⚪失效) ---------- */
function pinCheck(sym, st, curT, o, h, l, c, v, isReplay){
  if (st.bars.length < 8) return;             // 启动数据不足
  const atr10 = st.atr * Math.sqrt(PIN_WINDOW);
  if (!(atr10 > 0)) return;
  const win = st.bars.slice(-PIN_WINDOW);     // 最近10根已收盘 + 当前K线 = 窗口
  const base = win[0].o;                      // 基准价: 窗口第一根开盘价
  if (!(base > 0)) return;
  const atrPct = atr10 / base;                               // ★ ATR 按基准价归一(比例尺, 高低价币统一)
  /* 偏离阈值: 2.5×ATR10(归一) 且 ≥1.5%地板 且 ≤5%上限
     上限防"瀑布根污染": 刚暴跌完的币 ATR 被拉高, 不设限会在最易出二次插针(清算连锁)的时段失明 */
  const thr = Math.min(Math.max(PIN_ATR_MULT * atrPct, PIN_MIN_DEV), PIN_MAX_THR);

  /* ★第十轮⑤(预筛, 可选优化): 无挂卡 + 窗口极值距 base 双向都不到 PIN_MIN_DEV×0.9 → 本 tick 不可能 fire 也不可能新挂卡, 直接 return。
     ── 两守卫(对齐裁决版) ──
     ①[!st.pendingLow && !st.pendingHigh]: 有挂卡时绝不可跳过——failPend 转灰靠"偏离回落"路径, 拦了横盘黄卡只能干等 12min 超时;
     ②用 for 循环(不用 Math.min(...win.map())): 预筛本身是性能活, 不再造临时数组反增 GC。
     thr≥PIN_MIN_DEV 恒成立, 故振幅<0.9×地板 ⇒ dev<thr 恒成立 ⇒ 进不了 fire 也不满足挂卡门槛, 跳过零语义损失。 */
  if (!st.pendingLow && !st.pendingHigh){
    let pLow = l, pHigh = h;
    for (const b of win){ if (b.l < pLow) pLow = b.l; if (b.h > pHigh) pHigh = b.h; }
    if ((base - pLow) / base < PIN_MIN_DEV * 0.9 && (pHigh - base) / base < PIN_MIN_DEV * 0.9) return;
  }

  /* 窗口极值 + 极值出现时间 + 极值根量能(低点/高点分开记录) */
  let wLow = l, lowT = curT, lowVol = v, wHigh = h, highT = curT, highVol = v;
  for (const b of win){
    if (b.l < wLow){ wLow = b.l; lowT = b.t; lowVol = b.v; }
    if (b.h > wHigh){ wHigh = b.h; highT = b.t; highVol = b.v; }
  }
  /* 量能倍数: 极值根 vs 前20根均量(不含极值根), 低点/高点各自计算 */
  const volXOf = (t, vol)=>{
    const hist = st.bars.filter(b=>b.t !== t).slice(-20);
    let s = 0, n = 0;
    hist.forEach(b=>{ s += b.v; n++; });
    return (n && s > 0) ? vol / (s / n) : 0;
  };
  const volXLow = volXOf(lowT, lowVol), volXHigh = volXOf(highT, highVol);
  const nowMs = isReplay ? curT : Date.now();

  /* 🟢 Swing(六批#2 修正版): 窗口极值 ≈ 近30m 高/低点±0.2% → 标签透传(`||`保留式); slice(-30) 含最新已收盘根; 只标不过滤。 */
  const SWING_LB = 30;
  let leftSwingLow = Infinity, leftSwingHigh = -Infinity;
  {
    const pool = st.bars.slice(-SWING_LB);
    for (const b of pool){
      if (b.l < leftSwingLow) leftSwingLow = b.l;
      if (b.h > leftSwingHigh) leftSwingHigh = b.h;
    }
  }
  const hasSwingLow  = isFinite(leftSwingLow)  && wLow  <= leftSwingLow  * 1.002;
  const hasSwingHigh = isFinite(leftSwingHigh) && wHigh >= leftSwingHigh * 0.998;

  /* 👑 FVG/OB 分腿回看(七批): 只用「极值根时刻之前」已收盘根(bar.t < legT 严格小于)——针尖那根及其后永不参判(防自证)。
     fvgobFor(tip, legT) 单腿独立: FVG 三根组 i-1/i/i+1; bull=b.h<c.l→带[b.h,c.l]; bear=c.h<b.l→带[c.h,b.l]; 落位=|tip−CE(50%)|≤0.5×ATR。
     OB=大实体(实体/全幅≥0.6)且后一根未吃穿; 落位=tip∈OB带±0.5×ATR。只标不过滤。 */
  const fvgobFor = (tip, legT)=>{
    try{
      if (!(tip > 0) || !legT) return null;
      const hist = st.bars.filter(b => b.t < legT).slice(-60);
      if (hist.length < 12) return null;
      const buf = (atr10 > 0 ? atr10 : (st.atr || 0)) * 0.5;
      if (!(buf > 0)) return null;
      let fvg = null, ob = null;
      for (let i = 1; i < hist.length - 1; i++){
        const b = hist[i], c2 = hist[i+1];
        if (!fvg && c2.l > b.h * 1.001){ const lo = b.h, hi = c2.l, ce = (lo+hi)/2;
          if (Math.abs(tip - ce) <= buf) fvg = { lo, hi, ce, kind: "bull" }; }
        if (!fvg && c2.h < b.l * 0.999){ const lo = c2.h, hi = b.l, ce = (lo+hi)/2;
          if (Math.abs(tip - ce) <= buf) fvg = { lo, hi, ce, kind: "bear" }; }
      }
      for (let i = 0; i < hist.length - 1; i++){
        if (ob) break;
        const b = hist[i], nxt = hist[i+1];
        const body = Math.abs(b.c - b.o), range = b.h - b.l;
        if (!(range > 0) || body / range < 0.6) continue;
        const lo = Math.min(b.o, b.c), hi = Math.max(b.o, b.c);
        if (nxt.l <= lo && nxt.h >= hi) continue;          // 已测试, 不认
        if (tip >= lo - buf && tip <= hi + buf) ob = { lo, hi, kind: b.c >= b.o ? "bull" : "bear" };
      }
      return (fvg || ob) ? { fvg, ob } : null;
    }catch(_){ return null; }
  };
  const fvgobLow  = (wLow  > 0)        ? fvgobFor(wLow,  lowT)  : null;
  const fvgobHigh = (wHigh > base)     ? fvgobFor(wHigh, highT) : null;

  /* ✅ 确认(六批①重构): extremeBar 必须已收盘(在 st.bars)才进入; 未收盘 return false 退黄卡, 等收盘帧双复核再转正。
     影线: 下插下影/全幅≥0.5, 上插上影≥0.5(拒光头光脚砸盘); 未满的 volX 收盘终值在 fire 时刻读; 低量<0.8 只降级不拦。 */
  const fire = (side, tip, dev, retr, extremeT, volX, hasSwing, fvgob)=>{
    const key  = side === "sweep-low" ? "firedLow" : "firedHigh";
    const pk   = side === "sweep-low" ? "pendingLow" : "pendingHigh";
    const cdK  = side === "sweep-low" ? "lastFireLow" : "lastFireHigh";   // 分方向冷却: 上插/下插互不干扰
    if (st[key] === extremeT) return false;                   // 同一极值只报一次(拦截先于写入, 收盘后可再检)
    if (nowMs - st[cdK] < PIN_COOLDOWN) return false;          // 同方向 15 分钟冷却(另一方向不受影响)
    const extremeBar = st.bars.find(b => b.t === extremeT);
    if (!extremeBar) return false;                            // ★极值根未收盘 → 拒确认退黄卡
    {
      const range = extremeBar.h - extremeBar.l;
      if (range > 0){
        const lowerWick = Math.min(extremeBar.o, extremeBar.c) - extremeBar.l;
        const upperWick = extremeBar.h - Math.max(extremeBar.o, extremeBar.c);
        if (side === "sweep-low"  && lowerWick / range < 0.5) return false;   // 光头光脚砸盘不认
        if (side === "sweep-high" && upperWick / range < 0.5) return false;
      }
    }
    st[key] = extremeT;
    st[cdK] = nowMs;
    /* 强针: 量能5倍爆量或偏离≥5×ATR 且≥3%; 低量(<0.8)降级=免强针, 只打 lowVol 标记不拦截(用户拍板) */
    let strong = volX >= PIN_STRONG_VOL || (dev >= PIN_STRONG_DEV * atrPct && dev >= 0.03);
    const lowVol = volX < PIN_MIN_VOLX;
    if (lowVol) strong = false;
    const trend = trendAt(sym, nowMs).dir;   // 事件时刻的趋势快照(未加载时'na', 确认时 15m 回填)
    const pend = st[pk];
    let ev;
    if (pend && pend.status === "pending"){
      /* 黄卡转正: 原卡片保留, 时间改为确认时刻; hasSwing/fvg/ob 均||保留(出生命中不因转正 tick 未命中被抹) */
      pend.status = "confirmed"; pend.replay = !!isReplay;
      pend.strong = strong; pend.tip = tip; pend.dev = dev; pend.retr = retr;
      pend.volX = volX; pend.px = c; pend.ts = nowMs;
      pend.hasSwing = pend.hasSwing || hasSwing;
      pend.lowVol = pend.lowVol || lowVol;
      if (fvgob){ pend.fvg = pend.fvg || fvgob.fvg || null; pend.ob = pend.ob || fvgob.ob || null; }
      if (extremeBar) pend.kbar = { o: extremeBar.o, h: extremeBar.h, l: extremeBar.l, c: extremeBar.c };
      if (trend !== "na") pend.trend = trend;
      st[pk] = null;
      ev = pend;
    } else {
      ev = {
        ts: nowMs, sym, side, status: "confirmed",
        tip, base, dev, retr, volX, strong, px: c,
        replay: !!isReplay, trend,
        hasSwing: !!hasSwing, lowVol,
        kbar: extremeBar ? { o: extremeBar.o, h: extremeBar.h, l: extremeBar.l, c: extremeBar.c } : null,
        fvg: (fvgob && fvgob.fvg) || null,
        ob:  (fvgob && fvgob.ob)  || null,
      };
      pinEvents.push(ev);
    }
     if (pinEvents.length > PIN_MAX_EVENTS + 40) pinEvents = trimPinEvents(pinEvents);   // fire 内: 保护裁剪(第八轮③)
    if (!isReplay && pinIsCross(ev)){
      /* 逆势(插针方向与趋势相反): 不响铃不角标不推送, 仅刷新视图(卡片淡化置底供验证) */
      if (curView === "pin") render();
      pinRefreshTab();                          // 🟡黄角标同步(黄卡转终态后进行中数变化)
    } else if (!isReplay){
      pinBeep(strong);                          // 只有确认才提示
      if (ev.strong) sendPinCard(ev);           // ✨强针推飞书(内部再判顺势/回放)
      if (curView === "pin") render();
      else pinUnread++;                          // 角标只计确认
      pinRefreshTab();                           // 金/黄角标即时同步(含黄转红后-1)
    }
    savePinEvents();
    /* ★ 方案A(六批⑦): confirmed 时 15m 懒拉一次两用——趋势回填 + calcSLTP(同请求); 回放不拉 */
    if (!isReplay){
      fetchTrendConfirm(sym).then(info=>{
        if (!info) return;
        if (ev.trend === "na" || ev.trend === undefined) ev.trend = info.dir;
        calcSLTP(ev, info);
        savePinEvents();
        if (curView === "pin") scheduleRender();
      }).catch(()=>{});
    }
    return true;
  };

  /* 🟡 进行中: 偏离已达标但未回归60%, 挂黄卡静默刷新(不出声、不角标); ≥10% 刺眼标注
     六批①附注: 出生/刷新均携带 hasSwing/fvg/ob(||保留式); ⑥lastUpd 仅针尖加深时刷新; base 冻结。 */
  const updPend = (side, tip, dev, retr, volX, extremeT, hasSwing, fvgob)=>{
    const pk  = side === "sweep-low" ? "pendingLow" : "pendingHigh";
    const cdK = side === "sweep-low" ? "lastFireLow" : "lastFireHigh";
    if (st[pk] && st[pk].status !== "pending") st[pk] = null;   // 兑底: 引用已终态
    if (!st[pk]){
      if (nowMs - st[cdK] < PIN_COOLDOWN) return;         // 同方向冷却期不新开黄卡
      const ev = { ts: nowMs, sym, side, status: "pending", tip, base, dev, retr, volX, strong: false, px: c, replay: !!isReplay, lastUpd: nowMs, trend: trendAt(sym, nowMs).dir,
                    hasSwing: !!hasSwing, fvg: (fvgob && fvgob.fvg) || null, ob: (fvgob && fvgob.ob) || null, lowVol: false };
      pinEvents.push(ev);
      if (pinEvents.length > PIN_MAX_EVENTS + 40) pinEvents = trimPinEvents(pinEvents);
      st[pk] = ev;
      savePinEvents();
      if (!isReplay){                          // 回放/恢复: 只入库不响不渲染
        playZZ();                              // 📌进行中提示音(新黄卡出现响一次)
        pinRefreshTab();                       // 🟡黄角标即时+1(任意视图都常显进行中数)
        if (curView === "pin") scheduleRender();   // 正在看插针视图: 立即出卡(100ms防抖合并同秒多币)
      }
      return;
    }
    /* 已有黄卡 → 就地刷新数值(针尖更深/回归变化), 正在看插针视图则刷新列表 */
    const ev = st[pk];
    const deepened = (ev.side === "sweep-low") ? (tip < ev.tip) : (tip > ev.tip);
    ev.tip = tip; ev.dev = dev; ev.retr = retr; ev.volX = volX; ev.px = c;
    ev.hasSwing = ev.hasSwing || hasSwing;
    if (fvgob){ ev.fvg = ev.fvg || fvgob.fvg || null; ev.ob = ev.ob || fvgob.ob || null; }
    if (!(ev.base > 0)) ev.base = base;   // ★base 冻结: 有存档基准就不再随窗口滑(与超时判灰成对, 见本函数上方及末尾清扫)
    if (deepened) ev.lastUpd = nowMs;     // ★lastUpd 仅针尖加深时刷新(12min 无更深 → 末尾清扫判灰)
    if (!isReplay && curView === "pin") scheduleRender();
    savePinEvents();
  };

  /* ⚪ 失效: 窗口偏离不再达标(10分钟窗口滚过也没等到回归60%) */
  const failPend = (side)=>{
    const pk = side === "sweep-low" ? "pendingLow" : "pendingHigh";
    const ev = st[pk];
    if (ev && ev.status === "pending"){ ev.status = "failed"; st[pk] = null; if (!isReplay){ if (curView === "pin") scheduleRender(); pinRefreshTab(); } savePinEvents(); }   // 🟡黄角标同步: 黄转灰后进行中数-1
  };

  /* ⬇️ 扫下方: 窗口最低点相对基准大幅下探, 回归≥60%才确认偏多 */
  if (wLow > 0){
    const dev = (base - wLow) / base;
    if (dev >= thr){
      const depth = Math.max(base - wLow, 1e-12);
      const retr = (c - wLow) / depth;
      if (!(retr >= PIN_RETR && fire("sweep-low", wLow, dev, retr, lowT, volXLow, hasSwingLow, fvgobLow))){
        updPend("sweep-low", wLow, dev, Math.min(retr, 0.99), volXLow, lowT, hasSwingLow, fvgobLow);   // 未确认: 挂黄/刷黄
      }
    } else {
      failPend("sweep-low");   // 偏离不再达标: 黄卡转灰"未回归失效"
    }
  }
  /* ⬆️ 扫上方: 窗口最高点大幅冲高, 回归≥60%才确认偏空 */
  /* ★第十一轮P3: wHigh 判据防御——旧版裸 { 无条件算 dev, 垃圾数据(wHigh=NaN/≤0)时 dev=NaN 落 else
     → failPend 滥杀合法黄卡; 与 wLow 块对齐并补 isFinite 一档(数据修复中的 tick 不参与判定) */
  if (isFinite(wHigh) && wHigh > 0){
    const dev = (wHigh - base) / base;
    if (dev >= thr){
      const depth = Math.max(wHigh - base, 1e-12);
      const retr = (wHigh - c) / depth;
      if (!(retr >= PIN_RETR && fire("sweep-high", wHigh, dev, retr, highT, volXHigh, hasSwingHigh, fvgobHigh))){
        updPend("sweep-high", wHigh, dev, Math.min(retr, 0.99), volXHigh, highT, hasSwingHigh, fvgobHigh);
      }
    } else {
      failPend("sweep-high");
    }
  }

  /* 🎯 回踩入场监控: 顺势确认事件, 现价离开 针尖↔基准 35%~65% 区间后再次进入 → 提示一次
     (回踩 = 价格自区间外再度回到针尖与基准之间的回踩带, 供人工择机入场) */
  pinEvents.forEach(ev=>{
    if (ev.sym !== sym || ev.status !== "confirmed" || ev.replay || ev.reentry) return;
    if (ev.trend !== "up" && ev.trend !== "down") return;   // 仅顺势(横盘/未加载不提示)
    if (pinIsCross(ev)) return;
    const lo = Math.min(ev.tip, ev.base), hi = Math.max(ev.tip, ev.base);
    const zLo = lo + (hi - lo) * PIN_RE_LO, zHi = lo + (hi - lo) * PIN_RE_HI;
    const inZone = c >= zLo && c <= zHi;
    if (!inZone) ev.reArmed = true;         // 离开回踩区 → 待命
    else if (ev.reArmed){                    // 再进入回踩区 → 回踩入场提示
      ev.reentry = nowMs;
      if (!isReplay){ pinBeep(false); if (curView === "pin") scheduleRender(); }
      savePinEvents();
    }
  });

  /* ✅ ChoCh 微观二次确认(六批⑩ 修正版): 独立扫描(不挂回踩 return 链)。
     口径: N=3 根已收盘实体 c 突破 ev.kbar.h/l; 时间窗 15s..5min(防任意晚突破); 起点防同秒假突破。 */
  pinEvents.forEach(ev=>{
    if (ev.sym !== sym || ev.status !== "confirmed" || ev.replay || ev.choch || !ev.kbar) return;
    const age = nowMs - ev.ts;
    if (age < 15*1000 || age > 5*60*1000) return;
    const recent = st.bars.slice(-3);
    if (recent.length < 3) return;
    let hit = false;
    if (ev.side === "sweep-low"  && recent.some(b => b.c > ev.kbar.h)) hit = true;
    else if (ev.side === "sweep-high" && recent.some(b => b.c < ev.kbar.l)) hit = true;
    if (hit){
      ev.choch = nowMs;
      savePinEvents();
      if (!isReplay && curView === "pin") scheduleRender();
    }
  });

  /* ⏱️ 六批⑥(实时路径): 黄卡 12 分钟无更深针尖 → 判灰(与回放路径同语义)。 */
  ["pendingLow","pendingHigh"].forEach(pkk=>{
    const pe = st[pkk];
    if (pe && pe.status === "pending" && nowMs - (pe.lastUpd || pe.ts) > 12*60*1000){
      pe.status = "failed"; st[pkk] = null;
      if (!isReplay){ if (curView === "pin") scheduleRender(); pinRefreshTab(); }
      savePinEvents();
    }
  });
}

/* ---------- 订阅管理: TOP100 按成交额, 每5分钟重估增量增删 ---------- */
let pinEvalBusy = false;
async function pinEvalSubs(){
  if (pinEvalBusy) return;
  pinEvalBusy = true;
  try{
    const rows = Object.keys(volMap)
      .filter(s=>RANK_RE.test(s) && !CSOP_RE.test(s) && !PIN_BLOCK_RE.test(s))   // 人工盯盘: 不卡成交额门槛, TOP100 全要(仍剔交割/CSOP)
      .sort((a,b)=>volMap[b] - volMap[a])
      .slice(0, PIN_TOP_N);
    const want = new Set(rows.map(s=>s.toLowerCase() + "@kline_1m"));
    const add = [...want].filter(s=>!pinStreams.has(s));
    const del = [...pinStreams].filter(s=>!want.has(s));
    pinStreams = want;
    /* ★六批③+第八轮④/⑧(合并版): 剔除币收尾——
       先把该币掛着的黄卡标 failed(否则 st 删后 pinCheck 不再被调, 12min 清扫永不动它→僵尸黄卡永挂页面),
       再清三张 Map(冷却游标随之丢弃属已知副作用, 回TOP100可重报一次, 接受)。 */
    del.forEach(s=>{
      const sym = s.split("@")[0].toUpperCase();
      const st = pinState.get(sym);
      if (st){
        ["pendingLow","pendingHigh"].forEach(k=>{
          if (st[k] && st[k].status === "pending"){ st[k].status = "failed"; st[k] = null; }
        });
      }
      pinState.delete(sym);
      pinTrend.delete(sym);
      pinTrend15.delete(sym);   // 第八轮⑧: 15m 趋势缓存同清
    });
    if (ws && wsAlive && add.length) ws.send(JSON.stringify({method:"SUBSCRIBE", params:add, id:pinMsgId++}));
    if (ws && wsAlive && del.length) ws.send(JSON.stringify({method:"UNSUBSCRIBE", params:del, id:pinMsgId++}));
    /* Bitget 二源增量同步(第二数据腿): 主连接增删时同步发给 ws2(v2 candle1m 频道格式, 重订阅会重推 snapshot 用于对账补缺) */
    if (ws2 && ws2Alive && add.length) ws2.send(JSON.stringify({op:"subscribe", args:bgArgsOf(add)}));
    if (ws2 && ws2Alive && del.length) ws2.send(JSON.stringify({op:"unsubscribe", args:bgArgsOf(del)}));
    /* 新订阅币拉历史K线: 分批并发(每批6个)避免瞬间打满浏览器连接池 */
    for (let i = 0; i < add.length; i += 6){
      add.slice(i, i + 6).forEach(s=>pinInitHistory(s.split("@")[0].toUpperCase()));
      if (i + 6 < add.length) await new Promise(r=>setTimeout(r, 300));
    }
    if (curView === "pin") render();
  } finally { pinEvalBusy = false; }
}
function pinBoot(){
  if (pinBooted) return;
  pinBooted = true;
  loadPinEvents();                        // ★ 恢复当天事件(刷新不丢, 旧黄卡自动转灰)
  pinRefreshTab();                        /* ★v5 P3(2026-10-29): 恢复后立即同步 tab 角标; 上 P1 后刷新瞬间 pendN=0、pinUnread=0,
                                             本次渲染结果与默认态一致(肉眼零差异), 但属语义对齐——防将来有改动漏同步 */
  pinEvalSubs();
  setInterval(pinEvalSubs, 5*60*1000);    // 每5分钟按成交额重估订阅
  setInterval(refreshAllTrends, PIN_TREND_REFR);   // 每5分钟重估全部币的 5m 趋势
  schedulePinRepair(true);                // ★ 页面(重)启动即时修缺口: 跳过60s节流, 缺谁补谁(旧版要等 WS snapshot 1-2 分钟批量推送+下一轮修复, 现在冷启动即刻打 REST 补真实缺口, 最长约省 2 分钟)
  /* 増量部分: 启动 5 秒后再扫一次——冷启动时 pinEvalSubs 刚算完订阅表, pinStreams 可能还没满 100, 第二轮把漏网币补齐 */
  setTimeout(()=>{ if (!pinRepairing) schedulePinRepair(true); }, 5000);
  /* 📊 30分钟自证(六批⑤): 改用"确认后第30分钟那根 1m 收盘价"(bars 里 t≥ev.ts+30min 首根), 与回放路径同口径;
     pinState 无该币(掉出TOP100已清)时兜底 priceMap。 */
  setInterval(()=>{
    const now = Date.now();
    let changed = false;
    pinEvents.forEach(ev=>{
      if (ev.status !== "confirmed" || ev.replay || ev.verify !== undefined) return;
      if (now - ev.ts < PIN_VERIFY_MS) return;
      if (!(ev.px > 0)) return;
      const target = ev.ts + PIN_VERIFY_MS;
      let p = NaN;
      const st = pinState.get(ev.sym);
      if (st){
        const b = st.bars.find(x=>x.t >= target);
        if (b && b.c > 0) p = b.c;
      }
      if (!isFinite(p)){
        const pm = priceMap[ev.sym];
        if (typeof pm === "number" && isFinite(pm)) p = pm;
      }
      if (!isFinite(p)) return;
      ev.verify = p >= ev.px ? "win" : "lose";
      ev.verifyPct = (p - ev.px) / ev.px * 100;
      changed = true;
    });
    if (changed){ savePinEvents(); if (curView === "pin") render(); }
  }, 30*1000);
}
async function pinInitHistory(sym){
  const arr = await fapi(`/fapi/v1/klines?symbol=${encodeURIComponent(sym)}&interval=1m&limit=120`);
  const raw = Array.isArray(arr) ? arr.filter(k=>Array.isArray(k) && k.length > 6) : [];
  if (raw.length < 20) return;
  /* 剔末根: REST 最后一根几乎总是进行中(未收盘), 其 ohl 中间值被 bars 收录后会被
     x 去重逻辑拦住, WS 收盘帧无法覆盖 ⇒ 该根永久污染在中间值 —— 干脆不入, 留给 WS 补。 */
  raw.pop();
  const st = pinEnsureState(sym);
  const bars = raw.map(k=>({ t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5] }));
  /* 合并: 历史K线 + 已积累的实时K线(按时间戳去重——三条数据腿同根只计一次)
     2026-10-28 修排序 bug: 旧版 concat 后不 sort, 修复场景(REST带来晚于现有根的新根)时间序全乱
     且被 slice(-KEEP) 挤出 —— 修复路径完全失效。改为合并后统一按 t 排序。 */
  if (st.bars.length){
    const have = new Set(st.bars.map(b=>b.t));
    st.bars = bars.filter(b=>!have.has(b.t)).concat(st.bars).sort((a,b)=>a.t-b.t).slice(-PIN_BARS_KEEP);
  } else {
    st.bars = bars.slice(-PIN_BARS_KEEP);
  }
  st.atr = calcATR(st.bars);
  pinReplay(sym, st, bars);   // 用完整120根历史回放
  fetchTrend(sym);            // 趋势并行加载(完成后自动回填已生成事件的trend字段)
}

/* ---------- 历史回放: 用收盘K线逐根推进, 找最近2小时插针(复盘用) ---------- */
function pinReplay(sym, st, bars){
  const now = Date.now();
  const CUTOFF = now - 2*60*60*1000;   // 只回放最近2小时
  let lastFireLow = 0, lastFireHigh = 0;   // 分方向冷却游标(回放中独立推进)
  /* ★第十轮⑦(A+钳制定稿): 记回放前值——回放推进过(>前值)才在结束时钳制抬 floor;
     循环内不再恢复(旧版 restore 会把冷却清回 0, 历史针 100min 前时 Date.now()-100min>15min 照样放行=破防)。 */
  const lflBefore = st.lastFireLow || 0, lfhBefore = st.lastFireHigh || 0;
  for (let i = 15; i < bars.length; i++){
    const b = bars[i];
    if (b.t < CUTOFF) continue;
    /* 模拟: 把前 i 根当作已收盘序列, 当前根 b 作为最新K线做一次检测 */
    const saved = st.bars, savedAtr = st.atr;
    st.bars = bars.slice(0, i);
    st.atr = calcATR(st.bars);
    st.lastFireLow = lastFireLow; st.lastFireHigh = lastFireHigh;
    pinCheck(sym, st, b.t, b.o, b.h, b.l, b.c, b.v, true);
    lastFireLow = st.lastFireLow; lastFireHigh = st.lastFireHigh;   // 确认/黄卡新开都会写入, 无条件跟随
    st.bars = saved; st.atr = savedAtr;
    /* ★不再恢复 lastFireLow/High(第十轮⑦): 让其跟随回放推进, 结束后统一钳制 */
  }
  /* ★回放后钳制(语义="回放报过 ≈ 15 分钟内不再实时报"): fired 保留(跨 tick 防同根重复, 现状即对);
     >前值 守卫不能省——否则 Math.max(0, floor) 会把"从未报过"的币也锁 15 分钟, 实时真新针被误杀。
     生效场景: 回放报了 12:00 历史针, 实时 12:05 新针不再双报(旧版冷却被 restore 清零直接放行)。 */
  const floor = now - PIN_COOLDOWN;
  if (st.lastFireLow  > lflBefore)  st.lastFireLow  = Math.max(st.lastFireLow,  floor);
  if (st.lastFireHigh > lfhBefore) st.lastFireHigh = Math.max(st.lastFireHigh, floor);
  /* 回放结束: 挂着"进行中"超12分钟未更新的历史残留 → 判失效(防旧黄卡长期占顶) */
  pinState.forEach(ss=>{
    ["pendingLow","pendingHigh"].forEach(pkk=>{
      const ev = ss[pkk];
      if (ev && ev.status === "pending" && now - (ev.lastUpd||0) > 12*60*1000){ ev.status = "failed"; ss[pkk] = null; }
    });
  });
  /* 回放针自证: 用120根历史K线, 若 ts+30min 已落在数据内则直接判涨跌(刷新即时见统计) */
  pinEvents.forEach(ev=>{
    if (ev.sym !== sym || ev.status !== "confirmed" || ev.verify !== undefined) return;
    if (!(ev.px > 0)) return;
    const target = ev.ts + PIN_VERIFY_MS;
    const b = bars.find(x=>x.t >= target);
    if (b && b.c > 0){ ev.verify = b.c >= ev.px ? "win" : "lose"; ev.verifyPct = (b.c - ev.px) / ev.px * 100; }
  });
  pinDedupEvents();   // 跨机制去重: 同一根针在 存档/回放 中只保留一条
  if (curView === "pin") render();
  savePinEvents();
}

/* ---------- 插针视图渲染进主列表(🟡进行中置顶, 顺势确认, 逆势/失效淡化置底) ---------- */
/* 逆势定义(用户定稿): 插针方向与趋势相反 → 逆势。
   趋势多+向下插(扫下方) 或 趋势空+向上插(扫上方) = 逆势淡化置底;
   横盘/未加载不区分顺逆(横盘扫荡本就是 SMC 常见结构) */
function pinIsCross(ev){
  const t = ev.trend;
  if (t !== "up" && t !== "down") return false;
  return (t === "up" && ev.side === "sweep-low") || (t === "down" && ev.side === "sweep-high");
}
/* 节点复用版(2026-10-28 修"箭头几乎不动"): 旧版每次刷新 list.innerHTML="" 全量重建,
   实测 ~160ms 重建一次 ⇒ 进行中箭头 CSS 动画每次刚起步就被销毁重来, 永远停在 0% 相位。
   现按 sym|side|ts 复用卡片骨架: 每次刷新仅更新文本与类名, 不重建 .pin-arrow/卡片节点,
   也不无脑清空列表 ⇒ 值刷新渲染零 DOM 重建/移动, 进行中箭头浮动动画连续不断。 */
const pinCardMap = new Map();   // key(sym|side|ts) → 卡片节点
function renderPinList(){
  const cross = ev=>pinIsCross(ev);
  /* ⛔ 连续双扫(六批⑧): 渲染时实时算 dswpMap——30min 内同币反向确认 ⇒ 双卡同标+置底(与逆势/失效同层 rk=2, 保可见性); 计数行报数。 */
  const dswpMap = new Map();
  {
    const conf = pinEvents.filter(e=>e.status === "confirmed");
    for (const ev of conf){
      const opp = ev.side === "sweep-low" ? "sweep-high" : "sweep-low";
      if (conf.some(x => x !== ev && x.sym === ev.sym && x.side === opp && Math.abs(ev.ts - x.ts) <= 30*60*1000)) dswpMap.set(ev, true);
    }
  }
  const nDswp = dswpMap.size;
  /* 大号方向箭头(卡片右侧): 下插=红·做多信号 / 上插=绿·做空信号 / 进行中=黄 / 失效=灰 */
  const ARROW_DOWN = '<path d="M17,2 H31 V26 H40 L24,46 L8,26 H17 Z"/>';
  const ARROW_UP   = '<path d="M17,46 H31 V22 H40 L24,2 L8,22 H17 Z"/>';
  const keyOf = ev => ev.sym + "|" + ev.side + "|" + ev.ts;
  const all = pinEvents.slice().sort((a,b)=>{
    const rk = e=>{
      if (e.status === "pending") return 0;
      if (e.status === "failed")  return 2;
      if (cross(e))               return 2;
      if (dswpMap.get(e))         return 2;   // 双扫置底同层(六级会被40渲染窗切掉)
      return 1;
    };
    const ra = rk(a), rb = rk(b);
    if (ra !== rb) return ra - rb;   // 0进行中置顶 > 1顺势确认 > 2逆势/失效/双扫
    return b.ts - a.ts;
  });
  const evs = all.slice(0, RENDER_LIMIT);   // DOM 仅渲染前40条(与异动卡片一致, 防卡顿)
  const nPend = all.filter(e=>e.status === "pending").length;
  const nFail = all.filter(e=>e.status === "failed").length;
  const nCross = all.filter(e=>e.status === "confirmed" && cross(e)).length;
  const nWin = all.filter(e=>e.verify === "win").length;
  const nLose = all.filter(e=>e.verify === "lose").length;
  const nChoch = all.filter(e=>e.choch).length;
  const nFvg = all.filter(e=>e.fvg).length, nOb = all.filter(e=>e.ob).length;
  $("count").textContent = all.length
    ? `📌 插针 ${all.length} 条${all.length > RENDER_LIMIT ? `（显示前${RENDER_LIMIT}）` : ""} · 🟡进行中 ${nPend} · ⚪未回归 ${nFail} · ✗逆势 ${nCross}` + (nDswp ? ` · ⛔双扫 ${nDswp}` : "") + (nChoch ? ` · ✅ChoCh ${nChoch}` : "") + ((nFvg + nOb) ? ` · 👑FVG ${nFvg}/OB ${nOb}` : "") + ((nWin + nLose) ? ` · 📊30分自证 ${nWin}胜/${nLose}败` : "")
    : (pinStreams.size ? "📌 监测中 · 等待插针事件…"
       : (Object.keys(priceMap).length ? "⚠️ 行情已就绪 · 等待K线流连接…" : "⚠️ 数据源连接失败 · 自动重试中…"));   /* 故障可视化: 不再笼统"初始化中", REST全挂/行情就绪两态可辨 */
  const list = $("list");
  /* 空态: 清出全部卡片(保留在 Map 外), 补空态提示 */
  if (!evs.length){
    pinCardMap.forEach(el=>el.remove());
    pinCardMap.clear();
    if (!list.querySelector(".empty")){
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "📌 暂无插针事件 · 1m滑窗监测中";
      list.appendChild(d);
    }
    return;
  }
  list.querySelector(".empty")?.remove();

  const wanted = [];   // 本轮应显示的卡片(有序)
  evs.forEach(ev=>{
    const isLow = ev.side === "sweep-low";
    const pend = ev.status === "pending";
    const fail = ev.status === "failed";
    const isCross = cross(ev);
    const thin = isFinite(volMap[ev.sym]) && volMap[ev.sym] < PIN_VOL_THIN;   // 💤无量: 24H成交额过低
    const hp = highMap[ev.sym], lp = lowMap[ev.sym];
    let hl24 = "";
    if (isFinite(hp) && isFinite(lp) && hp > 0 && lp > 0){
      const touchH = !isLow && ev.tip >= hp * 0.995;   // 上插针尖贴近/越过 24H 高
      const touchL = isLow && ev.tip <= lp * 1.005;    // 下插针尖贴近/跌破 24H 低
      hl24 = `<span class="pin-hl24${(touchH || touchL) ? " touch" : ""}"><span class="lb">24H </span>${fmtPrice(lp)} ~ ${fmtPrice(hp)}${touchH ? " · 触24H高" : (touchL ? " · 触24H低" : "")}</span>`;
    }
    let dirCls, dirTxt, itemCls = "", pxLabel = "触发价 ", arrowCls;
    if (pend){
      /* 进行中: 状态徽章黄, 但大箭头已按方向着色(上插红↑/下插绿↓, 红涨绿跌)
         偏离≥10% 超级插针 → 刺眼橙红闪烁 */
      dirCls = "pending";  dirTxt = isLow ? "向下插针中" : "向上插针中";   itemCls = " pending"; pxLabel = "现价 "; arrowCls = isLow ? "low" : "high";
      /* 摆动分级: 摆幅/周期随偏离缩放(≥10% 大幅急摆+hot 橙红闪, 5%~10% 中幅, <5% 小幅慢摆) */
      const ad = Math.abs(ev.dev);
      if (ad >= PIN_HOT_DEV) itemCls += " hot d3";
      else if (ad >= PIN_DRIFT_MID) itemCls += " d2";
      else itemCls += " d1";
    } else if (fail){
      dirCls = "failed";    dirTxt = "未回归失效";    itemCls = " failed"; arrowCls = "fail";
    } else {
      dirCls = isLow ? "sweep-low" : "sweep-high";
      dirTxt = isLow ? "扫下方 · 偏多" : "扫上方 · 偏空";
      arrowCls = isLow ? "low" : "high";
      if (isCross) itemCls = " cross";   // 逆势: 淡化置底(不响铃不角标, 供回头验证)
    }
    /* 趋势标签(红涨绿跌): 角度制显示, ≥45° 标"强" */
    const ti = trendAt(ev.sym, ev.ts);
    let trendCls = "na", trendTxt = "⏳ 趋势加载";
    if (ti.dir === "up" || ti.dir === "down"){
      const sgn = ti.deg >= 0 ? "+" : "−";
      const strong = Math.abs(ti.deg) >= PIN_TREND_STRONG;
      if (ti.dir === "up"){ trendCls = "up";   trendTxt = `📈 ${strong ? "强多" : "趋势多"} ${sgn}${Math.abs(ti.deg)}°`; }
      else                 { trendCls = "down"; trendTxt = `📉 ${strong ? "强空" : "趋势空"} ${sgn}${Math.abs(ti.deg)}°`; }
    } else if (ti.dir === "flat"){
      trendCls = "flat"; trendTxt = `➖ 横盘 ${ti.deg >= 0 ? "+" : "−"}${Math.abs(ti.deg)}°`;
    }
    const strongCls = (ev.strong && !pend && !fail) ? " strong" : "";
    const devTxt = isLow ? "-" : "+";
    const volTxt = ev.volX >= 1 ? ev.volX.toFixed(1) + "×" : "—";
    const icon = (ev.strong && !pend && !fail) ? "📌✨" : "📌";
    /* 🔥 Killzone(六批⑨ 拍板 UTC13-17=北京21:00-01:00): 纯时间戳渲染, 零数据成本, 旧卡补标。 */
    const kzH = new Date(ev.ts).getUTCHours();
    const isKZ = (kzH >= 13 && kzH < 17);
    /* 卡片内容(只写 .pin-main 内部, 箭头区 .pin-side 不重建) */
    const mainHTML = `
        <div class="pin-row1">
          <span class="pin-sym">${icon} ${ev.sym}</span>
          <span class="tag">永续</span>
          <span class="pin-trend ${trendCls}">${trendTxt}</span>
          <span class="pin-dir ${dirCls}">${dirTxt}</span>
          ${isCross ? '<span class="pin-tag cross-tag">✗ 逆势</span>' : ''}
          ${ev.hasSwing ? '<span class="pin-tag swing">🟢 破近30分钟结构</span>' : ''}
          ${ev.fvg ? `<span class="pin-tag fvg">👑 FVG共振 ${ev.fvg.kind === 'bull' ? '↑' : '↓'}</span>` : ''}
          ${ev.ob ? `<span class="pin-tag ob">👑 OB共振 ${ev.ob.kind === 'bull' ? '↑' : '↓'}</span>` : ''}
          ${(ev.lowVol && !pend && !fail) ? '<span class="pin-tag lowvol">💤 低量降级</span>' : ''}
          ${dswpMap.get(ev) ? '<span class="pin-tag dswp">⛔ 连续双扫·观望</span>' : ''}
          ${isKZ ? '<span class="pin-tag kz">🔥 核心时段</span>' : ''}
          ${ev.choch ? '<span class="pin-tag choch">✅ ChoCh确认</span>' : ''}
          ${ev.reentry ? '<span class="pin-tag zone">🎯 回踩入场区</span>' : ''}
          ${thin ? '<span class="pin-tag thin">💤 无量</span>' : ''}
          ${ev.restored ? '<span class="pin-tag">存档</span>' : (ev.replay ? '<span class="pin-tag">回放</span>' : '')}
        </div>
        <div class="pin-row2">
          <span><span class="lb">针尖 </span><span class="px-tip">${fmtPrice(ev.tip)}</span></span>
          <span><span class="lb">偏离 </span>${(pend && Math.abs(ev.dev) >= PIN_HOT_DEV) ? `<span class="hot-dev">${devTxt}${(ev.dev*100).toFixed(1)}%</span>` : `${devTxt}${(ev.dev*100).toFixed(1)}%`}</span>
          <span><span class="lb">回归 </span>${Math.min(ev.retr*100, 100).toFixed(0)}%</span>
          <span><span class="lb">量能 </span>${volTxt}</span>
          <span><span class="lb">${pxLabel.trim()} </span>${pend ? `<span class="px-val">${fmtPrice(ev.px)}</span>` : fmtPrice(ev.px)}</span>
          ${hl24}
          ${ev.fvg ? `<span><span class="lb" style="color:#e8a2ff;">FVG带 </span>${fmtPrice(ev.fvg.lo)}~${fmtPrice(ev.fvg.hi)}<span class="lb"> CE</span>${fmtPrice(ev.fvg.ce)}</span>` : ''}
          ${ev.ob ? `<span><span class="lb" style="color:#ffc46b;">OB区 </span>${fmtPrice(ev.ob.lo)}~${fmtPrice(ev.ob.hi)}</span>` : ''}
          ${ev._sltp ? `<span class="pin-sltp">🎯 <span class="en">入</span> ${fmtPrice(ev.px)} · <span class="sg">损</span> ${ev._sltp.sl} · <span class="rx">标</span> ${ev._sltp.tp} · <span class="lb">R:R </span>${ev._sltp.rr}</span>` : ''}
        </div>
        <div class="pin-time">${tsFmt(ev.ts)}${pend ? " · 待回归≥60%" : ""}${(pend && Math.abs(ev.dev) >= PIN_HOT_DEV) ? " · ⚠️ 超偏≥10%" : ""}${ev.verify ? ` · <span class="pin-verify ${ev.verify}">${ev.verify === "win" ? "✅" : "❌"} 30分钟后 ${ev.verifyPct >= 0 ? "+" : ""}${ev.verifyPct.toFixed(2)}%</span>` : ""}${ev.reentry ? ` · 🎯 ${tsFmt(ev.reentry)} 进入回踩区` : ""}</div>`;

    let d = pinCardMap.get(keyOf(ev));
    if (!d){
      /* 首次出现: 一次性建好骨架(卡片 + .pin-main + .pin-side/.pin-arrow) */
      d = document.createElement("div");
      d.dataset.sym = ev.sym;
      d.title = "点击复制币种名";
      d.onclick = ()=>copySymbol(d.dataset.sym).then(ok=>{
        d.style.borderColor = ok ? "#fcd535" : "#f6465d";
        setTimeout(()=>{ d.style.borderColor = ""; }, 800);
      });
      const main = document.createElement("div"); main.className = "pin-main";
      const side = document.createElement("div");  side.className = "pin-side";
      const arrow = document.createElement("span"); arrow.className = "pin-arrow " + arrowCls;
      arrow.innerHTML = `<svg viewBox="0 0 48 48">${isLow ? ARROW_DOWN : ARROW_UP}</svg>`;
      side.appendChild(arrow);
      d.appendChild(main);
      d.appendChild(side);
      d.__main = main; d.__arrow = arrow;
      pinCardMap.set(keyOf(ev), d);
    }
    /* 更新: 仅当有变化才写(值不变 ⇒ 零 DOM 写入; 动画元素全程不重建) */
    const newCls = "pin-item" + itemCls + strongCls;
    if (d.className !== newCls) d.className = newCls;
    const wantArrowCls = "pin-arrow " + arrowCls;
    if (d.__arrow.className !== wantArrowCls) d.__arrow.className = wantArrowCls;
    if (d.__lastMain !== mainHTML){ d.__main.innerHTML = mainHTML; d.__lastMain = mainHTML; }
    if (wanted.indexOf(d) === -1) wanted.push(d);
  });

  /* 下线的卡片移出 DOM 并出表(超出40条/事件被清理) */
  pinCardMap.forEach((el, k)=>{
    if (wanted.indexOf(el) === -1){ el.remove(); pinCardMap.delete(k); }
  });
  /* 按当前顺序对齐: 仅错位时移动节点(新卡置顶/状态变化才发生, 值刷新零移动) */
  wanted.forEach((el, i)=>{
    const ref = list.children[i];
    if (ref !== el) list.insertBefore(el, ref || null);
  });
}

/* ---------- 插针提示音(合成三角波 G4→C5→G4, 与本地铃声/异动提示区分) ---------- */
let pinAudioCtx = null;
function pinBeep(strong){
  if (!soundOn) return;
  try{
    pinAudioCtx = pinAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (pinAudioCtx.state === "suspended"){ pinAudioCtx.resume().catch(()=>{}); }
    const notes = strong ? [392.00, 523.25, 659.25, 392.00] : [392.00, 523.25, 392.00];
    const t0 = pinAudioCtx.currentTime;
    notes.forEach((freq, i)=>{
      const osc = pinAudioCtx.createOscillator(), g = pinAudioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      const start = t0 + i * 0.13;
      const dur = (i === notes.length - 1) ? 0.26 : 0.12;
      osc.connect(g); g.connect(pinAudioCtx.destination);
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(.14, start + 0.02);
      g.gain.exponentialRampToValueAtTime(.001, start + dur);
      osc.start(start); osc.stop(start + dur + 0.05);
    });
  }catch(_){}
}
</script>
