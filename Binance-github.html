<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>币安市场异动 · 实时监控</title>
<link rel="icon" href="data:,">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scrollbar-width:thin; scrollbar-color:#2a323d #0b0e11; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:#0b0e11; }
  ::-webkit-scrollbar-thumb { background:#2a323d; border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:#3a4759; }
  body { background:#0b0e11; color:#eaecef; font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:640px; margin:0 auto; padding:16px 12px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  h1 { font-size:20px; font-weight:600; letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#2ebd85; box-shadow:0 0 8px #2ebd85; animation:pulse 1.6s infinite; }
  .dot.err { background:#f6465d; box-shadow:0 0 8px #f6465d; }
  @keyframes pulse { 50% { opacity:.35; } }
  .meta { font-size:12px; color:#848e9c; text-align:right; line-height:1.6; }
  .mode { font-weight:600; }
  .mode.live { color:#2ebd85; } .mode.err { color:#f6465d; }
  .lastmv { color:#848e9c; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; padding:8px 16px; border-radius:16px; font-size:13px; color:#848e9c; background:#181c23; border:1px solid #232a33; cursor:pointer; transition:all .15s; user-select:none; }
  .tab:hover { color:#eaecef; }
  .tab:focus-visible { outline:2px solid #fcd535; outline-offset:2px; }
  .tab.on { background:#2b3648; color:#fcd535; border-color:#3a4759; font-weight:600; }
  .tabs.period { padding-bottom:4px; }
  .tabs.period .tab { padding:4px 12px; font-size:12px; color:#a5adbb; background:transparent; }
  .tabs.period .tab:hover { color:#eaecef; }
  .tabs.period .tab.on { background:#1f2735; color:#fcd535; border-color:#39485a; }
  .rowwrap { display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  .rowwrap .tabs { flex:1 1 auto; min-width:0; }   /* 占满剩余宽度，滚动区最大化 */
  .dimlab { font-size:11px; color:#848e9c; flex:0 0 auto; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin:4px 0 12px; font-size:12px; color:#848e9c; }
  .sound { cursor:pointer; background:#181c23; border:1px solid #232a33; color:#848e9c; border-radius:8px; padding:5px 10px; font-size:16px; line-height:1; transition:all .15s; filter:grayscale(1) opacity(.55); }   /* 纯图标: 默认灰=关 */
  .sound:focus-visible { outline:2px solid #fcd535; outline-offset:2px; }
  .sound.on { color:#fcd535; border-color:#3a4759; filter:none; opacity:1; }            /* 点击开=彩色 */
  .sound.always { filter:none; opacity:1; }                                            /* 测试键无开关概念, 常彩 */
  /* 声音默认开的实现: 刷新后首个用户手势(任意点击)解锁 <audio>, 避免无交互自动播放被浏览器策略拒掉 */
  .list { display:flex; flex-direction:column; gap:8px; }
  .item { position:relative; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto auto; grid-template-areas:"sym pctrow" "ts pricow"; gap:4px 12px; background:#12161c; border:1px solid #1e242c; border-radius:12px; padding:12px 16px; transition:border-color .2s, transform .08s; }
  .icon { width:24px; height:24px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; vertical-align:middle; }
  .icon.cry-emoji { font-size:28px; line-height:1; }
  .icon.rocket-emoji { font-size:26px; line-height:1; }
  .icon svg { display:block; }
  .sym { grid-area:sym; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sym b { font-size:17px; font-weight:700; letter-spacing:.3px; }
  .tag { font-size:10px; color:#848e9c; background:#1e242c; border-radius:4px; padding:2px 8px; }
  .ts { grid-area:ts; font-size:14px; color:#7d8597; font-variant-numeric:tabular-nums; }
  .vol { display:block; font-size:14px; font-weight:700; color:#b7c0cc; font-variant-numeric:tabular-nums; white-space:nowrap; margin-bottom:2px; }
  .vol .plabel { font-size:12px; font-weight:400; color:#848e9c; }
  .pctrow { grid-area:pctrow; display:flex; align-items:center; gap:7px; justify-self:end; }
  .pct { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .pct.mid { font-size:18px; }   /* 3%+ 涨跌幅略大(不超过5%大异动的22px) */
  .up { color:#f6465d; } .down { color:#2ebd85; }
  .pricow { grid-area:pricow; display:flex; align-items:center; justify-self:end; }
  .price { font-size:14px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; color:#b7c0cc; }
  .price .plabel { font-size:12px; font-weight:400; color:#848e9c; }
  .kind { font-size:13px; color:#b7c0cc; }
  .empty { text-align:center; color:#848e9c; padding:48px 0; font-size:13px; }
  footer { text-align:center; margin-top:16px; font-size:11px; color:#707a8a; }

  /* ===== 类型下拉选择器(antd Select 交互规范 · 内联展开不遮挡) ===== */
  .sel { position:relative; flex:1 1 auto; min-width:0; }
  .sel.disabled { opacity:.35; pointer-events:none; }
  .sel-btn { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 12px; height:36px; background:#181c23; border:1px solid #232a33; border-radius:10px; font-size:13px; font-weight:600; color:#eaecef; cursor:pointer; user-select:none; transition:border-color .15s; }
  .sel-btn:hover { border-color:#3a4759; }
  .sel-btn:focus-visible { outline:2px solid #fcd535; outline-offset:2px; }
  .sel-val { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sel-arrow { font-size:10px; color:#848e9c; transition:transform .2s; flex:0 0 auto; }
  .sel.open .sel-arrow { transform:rotate(180deg); }
  /* 菜单为独立整行、内联展开(文档流) + 3列紧凑网格: 不再浮层遮挡周期行 */
  .sel-menu { display:none; margin:6px 0 10px; background:#181c23; border:1px solid #2a323d; border-radius:10px; padding:4px; }
  .sel-menu.open { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:2px; animation:menuIn .15s ease; }
  @keyframes menuIn { from { transform:translateY(-4px); opacity:0; } to { transform:none; opacity:1; } }
  .sel-opt { display:flex; align-items:center; justify-content:center; gap:4px; padding:8px 4px; border-radius:6px; font-size:13px; color:#b7c0cc; cursor:pointer; user-select:none; white-space:nowrap; }
  .sel-opt:hover, .sel-opt.kb-active { background:#1f2735; color:#eaecef; }
  .sel-opt[aria-selected="true"] { color:#fcd535; font-weight:600; }
  .sel-opt[aria-selected="true"]::after { content:"✓"; font-size:12px; font-weight:700; }
  .tabs.disabled { opacity:.35; pointer-events:none; }
  /* 24H榜单标签: 类型行右侧, 与类型下拉互斥的视图切换(小号tab) */
  .tabs.ranktabs { display:flex; gap:6px; flex:0 0 auto; padding-bottom:0; }
  .tabs.ranktabs .tab { display:inline-flex; align-items:center; padding:0 10px; height:36px; font-size:12px; }

  /* ===== 24H 榜单行(复用 .item 条幅布局) ===== */
  .rank-medal { font-size:20px; line-height:1; flex:0 0 auto; }
  .rank-no { font-size:12px; font-weight:700; color:#848e9c; background:#1e242c; border-radius:4px; padding:2px 8px; font-variant-numeric:tabular-nums; flex:0 0 auto; }

  /* ===== 5m 大异动重点标注 ===== */
  .item.alert-up, .item.alert-down { border-width:2px; }
  .item.alert-up { border-color:#f6465d; background:linear-gradient(100deg,#3d1418 0%,#1a1418 55%,#12161c 100%); animation:upGlow 1.8s ease-in-out 4; }
  .item.alert-down { border-color:#2ebd85; background:linear-gradient(100deg,#0f2e24 0%,#132a1c 55%,#12161c 100%); animation:downGlow 1.8s ease-in-out 4; }
  @keyframes upGlow { 0%,100%{ box-shadow:0 0 8px rgba(246,70,93,.22);} 50%{ box-shadow:0 0 24px rgba(246,70,93,.55);} }
  @keyframes downGlow { 0%,100%{ box-shadow:0 0 8px rgba(46,189,133,.22);} 50%{ box-shadow:0 0 24px rgba(46,189,133,.55);} }
  .item.alert-up .pct, .item.alert-down .pct { font-size:22px; }
  .item.alert-up .sym b, .item.alert-down .sym b { font-size:18px; }
  .item.alert-up .icon, .item.alert-down .icon { width:28px; height:28px; border-radius:8px; }
  .badge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; letter-spacing:.5px; flex:0 0 auto; }
  .badge.up-badge { color:#fff; background:#f6465d; box-shadow:0 0 8px rgba(246,70,93,.5); }
  .badge.down-badge { color:#fff; background:#2ebd85; box-shadow:0 0 8px rgba(46,189,133,.5); }

  /* ===== 点击复制反馈 ===== */
  .item:hover { border-color:#3a4759; }
  .item.alert-up:hover { border-color:#ff7583; }
  .item.alert-down:hover { border-color:#46e0ac; }
  .item.copied { border-color:#fcd535; }
  .copybadge { font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px; letter-spacing:.5px; flex:0 0 auto; animation:tipIn .18s ease; }
  .copybadge.ok { color:#12161c; background:#fcd535; }
  .copybadge.bad { color:#fff; background:#f6465d; }
  @keyframes tipIn { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  .item:active { transform:scale(.992); }

  /* ===== 📌 插针视图(周期栏标签切换, 渲染进主列表) ===== */
  .tab.pin-tab { display:inline-flex; align-items:center; gap:4px; color:#fcd535; border-color:#3a4759; background:rgba(252,213,53,.05); }
  .tab.pin-tab:hover { color:#ffe680; }
  .tab.pin-tab.on { background:#33290f; color:#fcd535; border-color:#fcd535; box-shadow:0 0 8px rgba(252,213,53,.25); }
  .tab.pin-tab .pin-cnt { font-size:10px; color:#0b0e11; background:#fcd535; border-radius:8px; padding:0 5px; min-width:14px; text-align:center; font-weight:700; }
  .tab.pin-tab.disabled { opacity:.35; pointer-events:none; }
  .tab.pt.disabled { opacity:.35; pointer-events:none; }
  .pin-item { background:#12161c; border:1px solid #1e242c; border-radius:12px; padding:12px 16px; display:flex; gap:14px; align-items:center; }
  .pin-main { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .pin-side { flex:0 0 auto; display:flex; align-items:center; }   /* 右侧大方向箭头区(原空白区) */
  .pin-arrow { width:56px; height:88px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }   /* 容器高88, 容纳80px长箭头 */
  .pin-arrow svg { width:34px; height:46px; display:block; }   /* 框内小箭头, 进行中按偏离分级浮动(见 d1/d2/d3) */
  .pin-arrow.low  { background:rgba(46,189,133,.10); border:1.5px solid rgba(46,189,133,.45); box-shadow:0 0 12px rgba(46,189,133,.25); } .pin-arrow.low  svg path { fill:#2ebd85; }   /* 扫下方=绿·向下(红涨绿跌, 含进行中) */
  .pin-arrow.high { background:rgba(246,70,93,.10);  border:1.5px solid rgba(246,70,93,.45);  box-shadow:0 0 12px rgba(246,70,93,.25); }  .pin-arrow.high svg path { fill:#f6465d; }  /* 扫上方=红·向上(红涨绿跌, 含进行中) */
  .pin-arrow.fail { background:rgba(112,122,138,.06); border:1.5px solid rgba(112,122,138,.3); }                     .pin-arrow.fail svg path { fill:#707a8a; }
  .pin-item.strong { border-color:#fcd535; background:linear-gradient(100deg,#33290f 0%,#1c1913 55%,#12161c 100%); animation:pinGlow 1.8s ease-in-out 4; }
  @keyframes pinGlow { 0%,100%{ box-shadow:0 0 8px rgba(252,213,53,.2);} 50%{ box-shadow:0 0 22px rgba(252,213,53,.5);} }
  .pin-row1 { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pin-sym { font-size:17px; font-weight:700; letter-spacing:.3px; }
  .pin-dir { font-size:12px; font-weight:700; padding:2px 8px; border-radius:6px; flex:0 0 auto; }
  .pin-dir.sweep-low  { color:#fff; background:#f6465d; box-shadow:0 0 8px rgba(246,70,93,.45); }   /* 扫下方=猎杀多头止损·偏多=红 */
  .pin-dir.sweep-high { color:#fff; background:#2ebd85; box-shadow:0 0 8px rgba(46,189,133,.45); }  /* 扫上方=猎杀空头止损·偏空=绿 */
  .pin-tag { font-size:11px; color:#848e9c; background:#1e242c; border-radius:4px; padding:2px 8px; }
  .pin-row2 { display:flex; gap:4px 16px; flex-wrap:wrap; font-size:15px; color:#b7c0cc; font-variant-numeric:tabular-nums; }
  .pin-row2 .lb { color:#848e9c; }
  .pin-row2 .px-val { color:#f6465d; font-weight:800; font-size:17px; }   /* 进行中"现价"后价格数字: 纯红无光晕(用户要求去发光) */
  .pin-row2 .px-tip { color:#f6465d; font-weight:700; }   /* 针尖价格红色(用户要求) */
  .pin-tag.swing  { color:#2ebd85; border:1px solid rgba(46,189,133,.4); background:rgba(46,189,133,.08); }   /* 🟢破近30分钟结构(只标不过滤) */
  .pin-tag.lowvol { color:#848e9c; border:1px solid rgba(132,142,156,.4); background:rgba(132,142,156,.08); }   /* 💤低量降级(免强针, 不拦截) */
  .pin-tag.dswp   { color:#ff8a4d; border:1px solid rgba(255,138,77,.45); background:rgba(255,138,77,.08); }   /* ⛔连续双扫·观望(30min同币反向) */
  .pin-tag.kz     { color:#fcd535; border:1px solid rgba(252,213,53,.4); background:rgba(252,213,53,.08); }   /* 🔥核心时段(北京21:00-01:00=UTC13-17) */
  .pin-tag.choch  { color:#31b5ff; border:1px solid rgba(49,181,255,.4); background:rgba(49,181,255,.08); }   /* ✅ChoCh实体突破确认 */
  .pin-tag.fvg    { color:#e8a2ff; border:1px solid rgba(232,162,255,.5); background:rgba(232,162,255,.1); }   /* 👑FVG共振(针入公允缺口CE) */
  .pin-tag.ob     { color:#ffc46b; border:1px solid rgba(255,196,107,.5); background:rgba(255,196,107,.1); }   /* 👑OB共振(针入订单块) */
  .pin-sltp { font-size:14px; color:#d9dee6; }   /* 🎯 SL/TP: 白=入 绿=损 红=标 */
  .pin-sltp .en { color:#fff; font-weight:700; }
  .pin-sltp .sg { color:#2ebd85; font-weight:700; }
  .pin-sltp .rx { color:#f6465d; font-weight:700; }
  .pin-time { font-size:13.5px; color:#7d8597; font-variant-numeric:tabular-nums; }
  /* 🟡进行中 / ⚪失效 状态样式; 超偏≥10% 进行中=刺眼橙红闪烁(⚠️远离插针针尖, 可能在扫大流动性) */
  .pin-item.pending { border-color:#c9a227; background:linear-gradient(100deg,#2b2408 0%,#1d1b0c 55%,#12161c 100%); animation:pendingGlow 2s ease-in-out infinite; }
  @keyframes pendingGlow { 0%,100%{ box-shadow:0 0 6px rgba(201,162,39,.22);} 50%{ box-shadow:0 0 18px rgba(201,162,39,.6);} }
  /* 🟡进行中卡片: 偏离分级驱动箭头浮动(d1/d2/d3 三档必居其一, 无需基础规则) */
  /* 摆动分级(2026-10-28): 箭头幅度/周期随偏离百分比缩放, 波动越大摆得越猛 ——
     d1(偏离2.5%~5%)小幅慢摆 10px/2.4s; d2(5%~10%)中幅 15px/1.8s; d3(≥10%超偏)大幅急摆 20px/1.2s */
  .pin-item.pending.d1 .pin-arrow.low  svg { animation:arrowDriftD1 2.4s ease-in-out infinite; }
  .pin-item.pending.d1 .pin-arrow.high svg { animation:arrowDriftU1 2.4s ease-in-out infinite; }
  .pin-item.pending.d2 .pin-arrow.low  svg { animation:arrowDriftD2 1.8s ease-in-out infinite; }
  .pin-item.pending.d2 .pin-arrow.high svg { animation:arrowDriftU2 1.8s ease-in-out infinite; }
  .pin-item.pending.d3 .pin-arrow.low  svg { animation:arrowDriftD3 1.2s ease-in-out infinite; }
  .pin-item.pending.d3 .pin-arrow.high svg { animation:arrowDriftU3 1.2s ease-in-out infinite; }
  @keyframes arrowDriftD1 { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(10px);} }   /* 小幅慢摆 */
  @keyframes arrowDriftU1 { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
  @keyframes arrowDriftD2 { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(15px);} }   /* 中幅中速 */
  @keyframes arrowDriftU2 { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-15px);} }
  @keyframes arrowDriftD3 { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(20px);} }   /* 大幅急摆(叠加热卡�红闪边框) */
  @keyframes arrowDriftU3 { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-20px);} }
  .pin-item.pending.hot { border-color:#ff5e2b; background:linear-gradient(100deg,#3a1504 0%,#2b0f06 55%,#12161c 100%); animation:pinHotGlow 1.1s ease-in-out infinite; }
  @keyframes pinHotGlow { 0%,100%{ box-shadow:0 0 10px rgba(255,94,43,.35);} 50%{ box-shadow:0 0 26px rgba(255,94,43,.85);} }
  .pin-row2 .hot-dev { color:#ff8a4d; font-weight:800; text-shadow:0 0 8px rgba(255,94,43,.8); font-size:17px; }
  .pin-item.failed  { opacity:.45; border-color:#232a33; }
  .pin-dir.pending  { color:#0b0e11; background:#fcd535; box-shadow:0 0 8px rgba(252,213,53,.4); }   /* 进行中=黄 */
  .pin-dir.failed   { color:#0b0e11; background:#707a8a; }                                      /* 未回归失效=灰 */
  /* 趋势标签 + 逆势淡化 */
  .pin-trend { font-size:11px; font-weight:600; padding:2px 8px; border-radius:6px; flex:0 0 auto; white-space:nowrap; }
  .pin-trend.up   { color:#f6465d; background:rgba(246,70,93,.12); border:1px solid rgba(246,70,93,.4); }   /* 趋势多=红(涨色) */
  .pin-trend.down { color:#2ebd85; background:rgba(46,189,133,.12); border:1px solid rgba(46,189,133,.4); } /* 趋势空=绿(跌色) */
  .pin-trend.flat, .pin-trend.na { color:#848e9c; background:#1e242c; border:1px solid #2a323d; }
  .pin-item.cross { opacity:.4; }
  .pin-tag.cross-tag { color:#f6465d; border:1px solid rgba(246,70,93,.4); background:rgba(246,70,93,.08); }
  /* ===== 插针卡增强: 无量/回踩区/24H高低/30分钟自证(红涨绿跌) ===== */
  .pin-tag.thin { color:#c9a227; border:1px solid rgba(201,162,39,.4); background:rgba(201,162,39,.08); }
  .pin-tag.zone { color:#fcd535; border:1px solid rgba(252,213,53,.55); background:rgba(252,213,53,.14); animation:zonePulse 1.6s ease-in-out infinite; }
  @keyframes zonePulse { 0%,100%{ box-shadow:0 0 4px rgba(252,213,53,.2);} 50%{ box-shadow:0 0 14px rgba(252,213,53,.55);} }
  .pin-hl24 { color:#848e9c; } .pin-hl24.touch { color:#ff8a5d; font-weight:700; text-shadow:0 0 8px rgba(255,138,93,.35); }
  .pin-verify.win { color:#f6465d; font-weight:600; } .pin-verify.lose { color:#2ebd85; font-weight:600; }
  .pin-tab .pin-cnt.pend { background:#c9a227; }

  /* 无障碍"降低动效"规则已移除(2026-10-28): 本机系统报告 prefers-reduced-motion,
     该规则会把所有动画压成 0.01ms —— 箭头浮动/呼吸边框全部静止, 与用户要的可动箭头直接冲突 */
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot" id="dot"></span>市场异动</h1>
    <div class="meta">币安+Bitget 双源<br><span id="status">连接中…</span></div>
  </header>

  <div class="rowwrap"><span class="dimlab">类型</span>

const BG_WS_URL = "wss://stream.bitget.cloud/public/v1/stream?terminalType=1";

/* ★ REST 域名双备份(2026-10-28 用户线索 4 域实测仅 cagxfucoftt.com 可用):
   fapi 全镜像同源, 主域挂掉自动切到备用域, 之后粘性使用新域(恢复后下轮再试主域)。
   WS 推送不掉线与此无关——WS 腿在别处(币安主 WS + Bitget 二源), 这里只护 REST 对账/修复腿。 */
const REST_BASES = ["https://www.icnguxncf.com", "https://www.cagxfucoftt.com", "https://fapi.binance.com"];   // 末位=币安官方API(代理环境可用, 直连被墙, 仅当镜像全挂才用)
let restBaseIdx = 0;
let restThrottleUntil = 0;   // 镜像限流封禁锁: 遇 418/429/too-many-requests 锁 60s, 锁内直接跳过不发请求(避免疯狂重试维持封禁)
/* ★第十一轮P3 注: 锁是全局的、不按域——任一域吃到 418, 官方域也被连带锁 60s。这是“两镜像+官方
   同一后端集团、限流按整体记”假设下的保守防封设计(宁可多等60s 不再打请求维持封禁), 有意为之不改 */
async function fapi(path){   // fapi 路径请求(带查询串); 候选池轮询(从上次成功域开始, 每个8s超时, 首个成功即粘性); 全部失败/限流返回 null
  if (Date.now() < restThrottleUntil) return null;   // 限流锁内: 零请求, 等解封
  const tryOnce = async (base)=>{
    const ctl = new AbortController();
    const tm = setTimeout(()=>ctl.abort(), 8000);
    try{
      const r = await fetch(base + path + (path.includes("?") ? "&" : "?") + "_t=" + Date.now(), {cache:"no-store", signal: ctl.signal});
      if (r.status === 418 || r.status === 429){ restThrottleUntil = Date.now() + 60000; return {__ban:true}; }
      const j = await r.json();
      if (j && (j.code === -1003 || /too many requests|banned/i.test(String(j.msg || "")))){ restThrottleUntil = Date.now() + 60000; return {__ban:true}; }
      return j;
    } finally { clearTimeout(tm); }
  };
  const n = REST_BASES.length;
  for (let k = 0; k < n; k++){
    const i = (restBaseIdx + k) % n;
    try{
      const j = await tryOnce(REST_BASES[i]);
      if (j && j.__ban) return null;                 // 限流: 已设 60s 锁, 本轮失败
      if (j !== null && j !== undefined){ restBaseIdx = i; return j; }   // 成功即粘性记忆
    }catch(_){}
  }
  return null;
}

const FEISHU_WEBHOOK = (localStorage.getItem("feishu_webhook") || "").trim()
  || "https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_WITH_YOUR_HOOK";   /* ★v4 P3: trim——粘贴带尾空格/换行时 ^...$ 锚定正则会失败, 用户无感知配置失效 */
const _whConfigured = /^https:\/\/open\.feishu\.cn\/open-apis\/bot\/v2\/hook\/[0-9a-f-]{20,}$/i.test(FEISHU_WEBHOOK);

  t.tabIndex = 0;
  t.setAttribute("aria-pressed", on ? "true" : "false");

  t.onkeydown = ev=>{ if (ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); onClick(); } };

function periodMatch(e){

    return String(e.period||"").toLowerCase() === "5m"
      || e.eventType === "DAY_UP_BREAKTHROUGH" || e.eventType === "DAY_DOWN_BREAKTHROUGH";
  }
  return String(e.period||"").toLowerCase() === curPeriod;
}

function typeText(e){
  const et = e.eventType, nt = e.noticeType, pd = e.period || "";
  if (nt === "PRICE_CHANGE"){
    const dir = et.startsWith("UP") ? "涨" : "跌";
    const lv  = {"1":"小","2":"中","3":"大"}[et.split("_")[1]] || "";
    return pd + lv + dir;
  }
  const map = {
    DAY_UP_BREAKTHROUGH:"今日新高", DAY_DOWN_BREAKTHROUGH:"今日新低",
    WEEK_UP_BREAKTHROUGH:"本周新高", WEEK_DOWN_BREAKTHROUGH:"本周新低",
    MONTH_UP_BREAKTHROUGH:"月内新高", MONTH_DOWN_BREAKTHROUGH:"月内新低",
    PULLBACK:"冲高回落", RALLY:"探底回升",
  };
  if (map[et]) return map[et];
  if (et.startsWith("HIGH_VOLUME_RISE")) return "放量涨 " + pd;
  if (et.startsWith("HIGH_VOLUME_FALL")) return "放量跌 " + pd;
  return et;
}

/* ---------- 异动图标(SVG) ---------- */
function iconFor(e){
  const et = e.eventType, nt = e.noticeType;
  const W = 'stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  const UP = '#f6465d', DOWN = '#2ebd85';
  const arrows = {
    1: `<path d="M7,19 L19,7 M12,7 H19 V14" ${W}/>`,
    2: `<path d="M5,18 L12,11 M7.5,11 H12 V15.5 M14,18 L21,11 M16.5,11 H21 V15.5" ${W}/>`,
    3: `<path d="M4,17 L9,12 M5.5,12 H9 V15.5 M10.5,17 L15.5,12 M12,12 H15.5 V15.5 M17,17 L22,12 M18.5,12 H22 V15.5" ${W}/>`,
  };
  const steep = `<path d="M8,21 L19,6 M13,6 H19 V12" ${W}/>`;
  const flipOpen = '<g transform="scale(1,-1) translate(0,-26)">', flipClose = '</g>';
  const hill = `<path d="M4,17 H8 C10,6 16,6 18,17 H22" ${W}/>`;
  const valley = `<path d="M4,9 H8 C10,20 16,20 18,9 H22" ${W}/>`;
  const brkUp = `<path d="M4,17 H13 L20,10 M14,10 H20 M20,10 V16" ${W}/>`;
  let bg = '#848e9c', inner = '';
  if (nt === "PRICE_CHANGE"){
    const n = et.split("_")[1] || '1';
    if (et.startsWith("UP"))         { bg = UP;   inner = arrows[n]; }
    else                              { bg = DOWN; inner = flipOpen + arrows[n] + flipClose; }
  } else if (et === "PULLBACK")      { bg = DOWN; inner = hill; }
  else if (et === "RALLY")           { bg = UP;   inner = valley; }
  else if (et.includes("UP_BREAKTHROUGH"))   { bg = UP;   inner = brkUp; }
  else if (et.includes("DOWN_BREAKTHROUGH")) { bg = DOWN; inner = flipOpen + brkUp + flipClose; }
  else if (et.startsWith("HIGH_VOLUME_RISE")){ bg = UP;   inner = steep; }
  else if (et.startsWith("HIGH_VOLUME_FALL")){ bg = DOWN; inner = flipOpen + steep + flipClose; }
  return `<span class="icon" style="background:${bg}"><svg width="18" height="18" viewBox="0 0 26 26">${inner}</svg></span>`;
}

/* 去重 key：按 币种+事件类型+时间 去重(不含 id)。
   币安对同一事件会生成多条不同 id 的记录(价格持续突破时每档生成一条)，
   按 symbol+eventType+createTimestamp 去重可合并这类重复 */
function keyOf(e){ return e.symbol+"|"+e.eventType+"|"+e.createTimestamp; }
const pad2 = n => String(n).padStart(2,"0");
function tsFmt(ms){
  const d = new Date(ms);
  return `${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}

/* ---------- 点击复制币种名 ---------- */
/* 优先 Clipboard API(file:// 下常被权限策略拒绝) → execCommand 兜底，保证双击打开也能复制 */
function copySymbol(text){
  return new Promise(res=>{
    const legacy = ()=>{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-999px;opacity:0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      let ok = false;
      try{ ok = document.execCommand("copy"); }catch(_){}
      ta.remove();
      res(ok);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>res(true)).catch(legacy);
    } else legacy();
  });
}
/* 复制反馈：条幅边框短暂高亮 + 币种名后浮现 ✓ 徽标，1.1s 自动消失 */
function showCopyTip(item, ok){
  const old = item.querySelector(".copybadge");
  if (old) old.remove();   // 连点防叠加
  item.classList.add("copied");
  const s = document.createElement("span");
  s.className = "copybadge " + (ok ? "ok" : "bad");
  s.textContent = ok ? "✓ 已复制" : "✗ 复制失败";
  item.querySelector(".sym").appendChild(s);
  setTimeout(()=>{ item.classList.remove("copied"); s.remove(); }, 1100);
}
/* 绑定点击复制币种名交互(拖选文字时不触发，方便手动选择内容)
   withKeyboard=true 时额外绑定 Enter/Space 键盘复制(榜单行需键盘可访问) */
function attachCopy(item, symbol, withKeyboard){
  item.title = "点击复制币种名";
  const tryCopy = ()=>{
    if (window.getSelection && String(window.getSelection())) return;   // 拖选文字不触发
    copySymbol(symbol).then(ok=>showCopyTip(item, ok));
  };
  item.onclick = tryCopy;
  if (withKeyboard){
    item.tabIndex = 0;
    item.onkeydown = ev=>{ if (ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); tryCopy(); } };
  }
}

/* ---------- 单条节点构造 ---------- */
function isBig5m(e){
  const v = parseFloat(e.priceChange);
  return String(e.period||"").toLowerCase() === "5m" && isFinite(v) && Math.abs(v) >= 0.05;
}
function itemNode(e){
  const raw = parseFloat(e.priceChange);
  const pct = isFinite(raw) ? raw*100 : 0;
  const up = pct >= 0;
  const big = isBig5m(e);
  let cls = "item";
  let iconHtml = iconFor(e);
  let badge = "";
  if (big){
    if (up){ cls += " alert-up"; iconHtml = ROCKET_ICON; badge = '<span class="badge up-badge">🚀 5m飙升</span>'; }
    else   { cls += " alert-down"; iconHtml = CRY_ICON; badge = '<span class="badge down-badge">😭 5m跳水</span>'; }
  }
  const item = document.createElement("div");
  item.className = cls;
  const pctCls = "pct " + (up?"up":"down") + (big ? "" : (Math.abs(pct) >= 3 ? " mid" : ""));
  /* 价格快照：异动检测到那一刻的价格，永远不随实时变化
     5M大异动优先用K线异动时刻价格(_moverPrice)，普通异动用快照(_snapPrice) */
  const pxVal = (big && typeof e._moverPrice === "number") ? e._moverPrice : e._snapPrice;
  const px = (typeof pxVal === "number") ? fmtPrice(pxVal) : "—";
  const qv = volMap[e.symbol];
  const volStr = (typeof qv === "number" && isFinite(qv)) ? fmtVol(qv) : "—";
  item.innerHTML = `
    <div class="sym"><b>${e.symbol}</b><span class="tag">永续</span>${badge}</div>
    <div class="ts"><span class="vol"><span class="plabel">24H：</span>${volStr}</span>${tsFmt(e.createTimestamp)}</div>
    <div class="pctrow">
      <span class="${pctCls}">${up?"+":""}${pct.toFixed(2)}%</span>${iconHtml}
    </div>
    <div class="pricow">
      <span class="price"><span class="plabel">价格：</span>${px}</span>
      <span class="kind">&nbsp;&nbsp;${typeText(e)}</span>
    </div>`;
  attachCopy(item, e.symbol, false);
  return item;
}

/* ---------- 渲染(全量重建, 最多渲染RENDER_LIMIT条；异步回调用 scheduleRender 防抖合并) ---------- */
let renderTimer = null;
function scheduleRender(){
  if (renderTimer) return;
  renderTimer = setTimeout(()=>{ renderTimer = null; render(); }, 100);
}
function render(){
  if (curView === "pin"){ renderPinList(); return; }   // 📌插针视图: 主列表渲染插针事件流
  if (isRankMode()){ renderRankList(); return; }   // 榜单视图：主列表渲染涨/跌幅榜
  const cat = CATS.find(c=>c[0]===curCat) || CATS[0];
  const filtered = movers.filter(e=>cat[2](e) && periodMatch(e));
  const rows = filtered.slice(0, RENDER_LIMIT);
  const n = filtered.length;
  $("count").textContent = n ? (n > RENDER_LIMIT ? `仅显示最新${RENDER_LIMIT}条 / 共${n}条` : `共 ${n} 条`) : "";
  const list = $("list");
  list.innerHTML = "";
  if (!rows.length){
    const d = document.createElement("div");
    d.className = "empty"; d.textContent = "📭 当前筛选暂无异动";
    list.appendChild(d); return;
  }
  const frag = document.createDocumentFragment();
  rows.forEach(e=>frag.appendChild(itemNode(e)));
  list.appendChild(frag);
}

/* ---------- 状态 ---------- */
function fmtClock(ms){
  const d = new Date(ms);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
}
function setStatus(mode){
  const dot = $("dot"), st = $("status");
  const lastMover = lastMoverTs ? ` · 最后异动 <span class="lastmv">${fmtClock(lastMoverTs)}</span>` : "";
  if (mode === "live"){
    dot.className = "dot";
    st.innerHTML = `<span class="mode live">● 实时推送</span> 已连接${lastMover}`;
  } else if (mode === "err"){
    dot.className = "dot err";
    st.innerHTML = `<span class="mode err">⚡ 连接中断</span> 正在重连…`;
  } else {
    dot.className = "dot";
    st.textContent = "连接中…";
  }
}

/* ---------- 声音(本地铃声): 正常提示 Canopus / 5m大涨大跌 Star_Struck / 进行中 ZZ ---------- */
const sndNormal = $("sndNormal"), sndBig = $("sndBig"), sndZZ = $("sndZZ");
/* 首次用户手势解锁 <audio> 自动播放(浏览器策略): 静音试播即建立自动播放授权, 之后事件铃声不再被拦截 */
let audioUnlocked = false;
function unlockAudio(){
  if (audioUnlocked) return;
  audioUnlocked = true;
  [sndNormal, sndBig, sndZZ].forEach(a=>{
    try{
      const p = a.play();
      if (p && p.then) p.then(()=>{ a.pause(); a.currentTime = 0; a.muted = false; }).catch(()=>{});
    }catch(_){}
  });
}
document.addEventListener("pointerdown", ()=>unlockAudio(), {once:true});
document.addEventListener("keydown", ()=>unlockAudio(), {once:true});
let lastBigTs = 0;                  // 上次 5m 大异动铃声(zzz)播放时间
const BIG_SUPPRESS_MS = 5000;       // 5m大异动后5秒内抑制普通aa提示, 防"5m大涨大跌时aa也响"重叠
function playSound(el){
  if (!soundOn || !el) return;
  /* 插针视图下: 普通/5m大异动铃声(非插针音源)静音暂停, 只放插针音源(ZZ/合成音) */
  if (curView === "pin" && el !== sndZZ){
    try{ if (!el.paused) el.pause(); el.currentTime = 0; }catch(_){}
    return;
  }
  try{
    el.currentTime = 0;            // 连续触发时从头播
    const p = el.play();            // 首次需用户点"声音开"产生交互后自动播放才被允许
    if (p && p.catch) p.catch(()=>{});
  }catch(_){}
}
/* 进入插针视图: 暂停当前正在响的普通/5m大异动铃声(已响到一半的也停掉) */
function muteNonPin(){
  try{ [sndNormal, sndBig].forEach(a=>{ if (!a.paused) a.pause(); a.currentTime = 0; }); }catch(_){}
}
function playNormal(){
  if (Date.now() - lastBigTs < BIG_SUPPRESS_MS) return;   // 刚播过5m大异动铃声, 5秒内跳过普通aa提示
  playSound(sndNormal);   // 正常提示
}
function playBig(){ lastBigTs = Date.now(); playSound(sndBig); }   // 5分钟大涨大跌
function playZZ(){ playSound(sndZZ); }   // 📌进行中(新黄卡出现)提示音: 本地 ZZ.mp3
$("sound").onclick = ()=>{
  soundOn = !soundOn;
  $("sound").classList.toggle("on", soundOn);   /* 纯图标: 开=彩色, 关=灰 */
};
/* 测试铃声按钮：单击=正常提示(aa) 双击=5m大涨大跌(zzz)。
   双击会先触发两次单击→用延时取消单击, 保证双击只播zzz不先播aa；
   不依赖 soundOn 开关，随时可自检；点击产生的用户手势也会顺带解锁后续自动播放 */
let testTimer = null;
$("testSnd").onclick = ()=>{
  if (testTimer) clearTimeout(testTimer);
  testTimer = setTimeout(()=>{ try{ sndNormal.currentTime=0; const p=sndNormal.play(); if(p&&p.catch)p.catch(()=>{}); }catch(_){} }, 280);
};
$("testSnd").ondblclick = ()=>{
  if (testTimer) clearTimeout(testTimer);   // 取消即将触发的单击aa
  try{ sndBig.currentTime=0; const p=sndBig.play(); if(p&&p.catch)p.catch(()=>{}); }catch(_){}
};

/* 推送状态显示(footer)：用户可直观看到推送是否工作 */
function markPush(ok, reason){
  const el = $("pushStatus");
  if (!el) return;
  const d = new Date();
  const tip = reason ? ` title="${reason}"` : "";   /* ★v4 P2 增强: ✗ 挂 title 悬停看根因——纯视觉用户看✗, 好奇用户悬看原因; reason 由代码内部传入无引号 */
  el.innerHTML = ` · <span${tip} style="color:${ok?"#2ebd85":"#f6465d"}">最后推送 ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())} ${ok?"✓":"✗"}</span>`;
}

/* ---------- 价格表(网页端显示 + 飞书推送共用; REST 并入 fapi 双域) ---------- */
const priceMap = {};   // symbol -> 当前价
const volMap   = {};   // symbol -> 24H成交额(quoteVolume)
const chgMap   = {};   // symbol -> 24H涨跌幅%(榜单合流用, 与价格表同拉同源)
const highMap  = {};   // symbol -> 24H最高价(插针触24H高低标注用)
const lowMap   = {};   // symbol -> 24H最低价
let priceTs = 0;       // 价格表最近一次成功刷新时刻(榜单复用判定依据)
let pricesInflight = null;   // ★第九轮⑤(实为启动双发): in-flight 复用——bootPrices 与 fetchMovers 并发时 priceTs=0 节流不命中, 两个 fetch 同时打全量 24hr(限流重灾区)
async function refreshPrices(){   // 全量拉取全部合约 24h 行情(价格+成交额; fapi 自动换域; 60s节流+并发合并)
  if (pricesInflight) return pricesInflight;
  const run = (async ()=>{
  if (priceTs && Date.now() - priceTs < 60000 && Object.keys(priceMap).length > 100){
    return true;   // 节流复用: 60s 内已拉过且非空 → 直接复用(30s校准不再重复打全量24hr——该接口weight高, 是镜像限流封禁重灾区)
  }
  const data = await fapi("/fapi/v1/ticker/24hr");
  if (Array.isArray(data)){
    for (const d of data){
      if (d && d.symbol){
        const p = parseFloat(d.lastPrice);
        if (isFinite(p)) priceMap[d.symbol] = p;
        const qv = parseFloat(d.quoteVolume);
        if (isFinite(qv)) volMap[d.symbol] = qv;
        const cg = parseFloat(d.priceChangePercent);
        if (isFinite(cg)) chgMap[d.symbol] = cg;
        const hp = parseFloat(d.highPrice), lp = parseFloat(d.lowPrice);
        if (isFinite(hp)) highMap[d.symbol] = hp;
        if (isFinite(lp)) lowMap[d.symbol] = lp;
      }
    }
    priceTs = Date.now();
    pinBoot();   // ★ 价格表就绪后初始化插针监测(内部防重入)
    return true;
  }
  return false;
  })();   // ← in-flight 内联异步体
  pricesInflight = run.finally(()=>{ pricesInflight = null; });
  return pricesInflight;
}
async function fetchPrice(symbol){   // 单币补查(快照/成交额缺失时补用，一次补价格+24h成交额; fapi 双域自动切换)
  const d = await fapi("/fapi/v1/ticker/24hr?symbol=" + encodeURIComponent(symbol));
  if (d && d.lastPrice){
    const p = parseFloat(d.lastPrice);
    if (isFinite(p)){ priceMap[symbol] = p; }
      const qv = parseFloat(d.quoteVolume);
      if (isFinite(qv)){ volMap[symbol] = qv; }
      const hp = parseFloat(d.highPrice), lp = parseFloat(d.lowPrice);
      if (isFinite(hp)){ highMap[symbol] = hp; }
      if (isFinite(lp)){ lowMap[symbol] = lp; }
      return p;
  }
  return NaN;
}
function fmtPrice(v){
  /* ★第八轮①(2026-10-29): 低价币 $0 修复——v=1.5e-7 时 maximumFractionDigits:6 会显示"$0";
     改按数量级动态精度: mag=floor(log10|v|), digits=min(max(-mag+3,2),10) —— 1e-7→保10位。 */
  if (!isFinite(v)) return "—";
  if (v === 0) return "$0";
  if (v >= 1000) return "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  if (v < 1){
    const mag = Math.floor(Math.log10(Math.abs(v)));
    const digits = Math.min(Math.max(-mag + 3, 2), 10);
    return "$" + v.toLocaleString("en-US", {maximumFractionDigits: digits, minimumFractionDigits: digits});
  }
  return "$" + v.toLocaleString("en-US", {maximumFractionDigits: 4});
}
/* 查询异动时刻的真实价格(用 K 线开盘价 × (1+priceChange) 计算，
   而不是当前实时价——即使异动发生在很久前也能算准) */
async function fetchMoverPrice(symbol, openTime, priceChange){
  const klines = await fapi(`/fapi/v1/klines?symbol=${encodeURIComponent(symbol)}&interval=5m&startTime=${openTime}&limit=1`);
  if (Array.isArray(klines) && klines.length){
    const open = parseFloat(klines[0][1]);   // K线开盘价
    if (isFinite(open) && open > 0){
      return open * (1 + parseFloat(priceChange));   // 异动时刻价格 = 开盘价 × (1 + 涨跌幅)
    }
  }
  return NaN;
}
async function sendFeishu(items){
  if (!feishuOn || !items.length) return;
  if (!_whConfigured) return;   /* ★④Step2: 未配置 hook(占位串/格式错) 拒发——不把消息发去错误端点 */
  const show = items.slice(0, 5);
  await Promise.all(show.map(async it=>{   /* ★第九轮③: 单条 try/catch——一条坏数据不毁整批 continue */
    try{
    /* 用 K 线计算异动时刻的真实价格：复用 ingestAll 已发起的查询避免重复请求 */
    if (typeof it._moverPrice !== "number"){
      if (it._moverPriceP){
        const p = await it._moverPriceP;   // 复用 ingestAll 发起的 K 线查询
        if (isFinite(p)) it._moverPrice = p;
      } else {
        const p = await fetchMoverPrice(it.symbol, it.openTime, it.priceChange);
        if (isFinite(p)) it._moverPrice = p;
      }
      if (typeof it._moverPrice !== "number"){
        it._moverPrice = (typeof it._snapPrice === "number") ? it._snapPrice : priceMap[it.symbol];   // 兑底
      }
    }
    /* 24H成交额缺失时补查一次(fetchPrice 同时补价格表) */
    if (typeof volMap[it.symbol] !== "number") await fetchPrice(it.symbol);
    }catch(e){ console.warn("[飞书] 单条预处理异常", it.symbol, e); }
  }));
  const elements = [];
  show.forEach((it, i)=>{
    const pct = parseFloat(it.priceChange);
    const up = isFinite(pct) ? pct >= 0 : true;
    const icon = up ? "🚀" : "😭";
    const col  = up ? "red" : "green";   // 与网页一致：红涨绿跌
    const tag  = up ? "5m飙升" : "5m跳水";
    const t = tsFmt(it.createTimestamp || Date.now());
    const px = fmtPrice(it._moverPrice);   // 异动时刻的真实价格
    const qv = volMap[it.symbol];
    const volStr = (typeof qv === "number" && isFinite(qv)) ? fmtVol(qv) : "—";
    const pctStr = isFinite(pct) ? (up?"+":"") + (pct*100).toFixed(2) + "%" : "—";
    /* 与网页条幅一致：左列=币种+24H成交额+时间，右列=价格+涨跌幅+图标+类型 */
    elements.push({
      tag: "column_set", flex_mode: "none",
      columns: [
        {tag: "column", width: "weighted", weight: 3, vertical_align: "center", elements: [
          {tag: "div", text: {tag: "lark_md", text_size: "large", content:
            `${icon} **${it.symbol}** <font color='grey'>永续</font>\n` +
            `<font color='grey'>24H：${volStr}</font>\n` +
            `<font color='grey'>⏱ ${t}</font>`}}
        ]},
        {tag: "column", width: "weighted", weight: 2, horizontal_align: "right", vertical_align: "center", elements: [
          {tag: "div", text: {tag: "lark_md", text_size: "large", content:
            `<font color='${col}'>${px}</font>\n` +
            `<font color='${col}'>${pctStr}</font> ${icon}\n` +
            `${tag}`}}
        ]}
      ]
    });
    if (i < show.length - 1) elements.push({tag: "hr"});
  });
  if (items.length > 5){
    elements.push({tag: "div", text: {tag: "lark_md", text_size: "normal", content: `<font color='grey'>… 等 ${items.length} 条</font>`}});
  }
  elements.push({tag: "hr"});
  elements.push({tag: "div", text: {tag: "lark_md", text_size: "normal", content: `<font color='grey'>数据来源：币安公开行情 · 仅供个人监控参考</font>`}});
  /* 卡片头部标题(红框区域)：单条=「币种永续 涨跌%」，多条=首条信息 + 等N条 */
  const f0 = show[0];
  const f0p = parseFloat(f0.priceChange);
  const f0pct = isFinite(f0p) ? (f0p>=0?"+":"") + (f0p*100).toFixed(2) + "%" : "—";
  const headerTitle = (items.length === 1)
    ? `🚨 ${f0.symbol}永续 ${f0pct}`
    : `🚨 ${f0.symbol}永续 ${f0pct} 等${items.length}条`;
  const card = {
    schema: "2.0",
    header: {template: "orange", title: {tag: "plain_text", content: headerTitle}},
    body: {elements}
  };
  const payload = JSON.stringify({msg_type: "interactive", card});
  /* 双通道发送：
     ① cors fetch(可读响应判断成败) → 成功即完成
     ② 失败(如 file:// 下 CORS 被阻) → no-cors + text/plain 重试
        (no-cors 模式下请求一定能发出，飞书按 body 内容解析 JSON 不看 Content-Type，已验证可行) */
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 8000);
  fetch(FEISHU_WEBHOOK, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: payload,
    credentials: "omit",
    signal: ctl.signal
  }).then(r=>r.json()).then(d=>{
    clearTimeout(timer);
    if (d && d.code === 0){ markPush(true); console.log("[飞书] 已推送", items.length, "条 5M异动"); }
    else { markPush(false); console.warn("[飞书] 推送失败", d); }
  }).catch(()=>{
    clearTimeout(timer);
    /* cors 模式被阻 → no-cors 重试(text/plain 简单请求不发预检) */
    fetch(FEISHU_WEBHOOK, {
      method: "POST",
      headers: {"Content-Type": "text/plain"},
      body: payload,
      mode: "no-cors"
    }).then(()=>{
      markPush(true);   /* no-cors 读不到响应，请求已发出即视为成功 */
      console.log("[飞书] 已推送(no-cors)", items.length, "条 5M异动");
    }).catch(e=>{

      console.warn("[飞书] 推送异常", e);
    });
  });
}

/* ---------- 飞书通用发送(双通道: cors fetch → no-cors 兜底, 与 sendFeishu 同套逻辑) ---------- */
function postCard(card, tag){
  if (!_whConfigured) return;   /* ★v4 P0②: sendPinCard → postCard 与 sendFeishu 共用同一 webhook, 未配置时同样拒发——否则打到占位串吃 400/404, markPush(false) 还会把 footer 误亮 ✗ */
  const payload = JSON.stringify({msg_type: "interactive", card});
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 8000);
  fetch(FEISHU_WEBHOOK, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: payload,
    credentials: "omit",
    signal: ctl.signal
  }).then(r=>r.json()).then(d=>{
    clearTimeout(timer);
    if (d && d.code === 0){ markPush(true); console.log("[飞书] 已推送", tag); }
    else { markPush(false); console.warn("[飞书] 推送失败", tag, d); }
  }).catch(()=>{
    clearTimeout(timer);
    fetch(FEISHU_WEBHOOK, {
      method: "POST",
      headers: {"Content-Type": "text/plain"},
      body: payload,
      mode: "no-cors"
    }).then(()=>{ markPush(true); console.log("[飞书] 已推送(no-cors)", tag); })
      .catch(e=>{ markPush(false); console.warn("[飞书] 推送异常", tag, e); });
  });
}
/* ✨ 强插针飞书卡片: 只推顺势确认(逆势/回放/未加载趋势不推) */
function sendPinCard(ev){
  if (!feishuOn || !ev || !ev.strong || ev.replay || pinIsCross(ev)) return;
  const isLow = ev.side === "sweep-low";
  const icon = isLow ? "⬇️" : "⬆️";
  const col  = isLow ? "red" : "green";   // 红涨绿跌: 扫下方=偏多=红 / 扫上方=偏空=绿
  const ti = trendAt(ev.sym, ev.ts);
  let trendTxt = "⏳ 趋势加载";
  if (ti.dir === "up" || ti.dir === "down"){
    const sgn = ti.deg >= 0 ? "+" : "−";
    trendTxt = `${ti.dir === "up" ? "📈 趋势多" : "📉 趋势空"} ${sgn}${Math.abs(ti.deg)}°`;
  } else if (ti.dir === "flat") trendTxt = `➖ 横盘 ${ti.deg >= 0 ? "+" : "−"}${Math.abs(ti.deg)}°`;
  const card = {
    schema: "2.0",
    header: {template: "red", title: {tag: "plain_text", content: `✨ 强插针 ${ev.symbol} 永续`}},
    body: {elements: [
      {tag: "div", text: {tag: "lark_md", text_size: "large", content:
        `${icon} **${isLow ? "扫下方 · 偏多" : "扫上方 · 偏空"}**\n` +
        `<font color='${col}'>针尖 ${fmtPrice(ev.tip)}</font>\n` +
        `<font color='grey'>偏离 ${isLow ? "-" : "+"}${(ev.dev*100).toFixed(1)}% · 回归 ${Math.min(ev.retr*100, 100).toFixed(0)}%</font>\n` +
        `<font color='grey'>量能 ${ev.volX >= 1 ? ev.volX.toFixed(1)+"×" : "—"} · 基准价 ${fmtPrice(ev.base)}</font>\n` +
        `<font color='grey'>${trendTxt} · ⏱ ${tsFmt(ev.ts)}</font>`}}
    ]}
  };
  postCard(card, `✨强插针 ${ev.symbol}(${isLow ? "多" : "空"})`);
}

/* ---------- 数据处理 ---------- */
function pushItem(e){
  const k = keyOf(e);
  if (seen.has(k)) return false;
  seen.add(k);
  movers.push(e);   /* ★v4 P0①: 必须在 seen 重建之前 push——否则重建用旧 movers(不含 e), e 的 key 落不进新 seen, 下次同 key 到达会重复入库 */
  /* ★第九轮①(2026-10-29): 裁剪基准与 movers 对齐——旧版按插入序 slice(-1500) 与 movers 按 createTimestamp 排序后 slice(500) 两窗不一致,
   乱序迟到+key 滑出窗+事件仍在 movers→重复入库; 现以 movers 当前集合为准重建(余量 3 倍+100)。 */
  if (seen.size > movers.length * 3 + 100){
    seen = new Set(movers.map(keyOf));
  }
  return true;
}
function ingestAll(list, silent){
  let added = 0, newMatch = 0;
  let newBig5 = false;            // 本轮是否有新增 5M 大异动(独立于飞书开关, 决定铃声 zzz)
  const new5m = [];   // 本轮新增的 5M 大异动(待飞书推送)
  const cat = CATS.find(c=>c[0]===curCat) || CATS[0];   // 榜单模式下回落到"全部"，后台异动照常入库
  /* 新异动判定基线：用全局最新异动时间戳，省去每轮 O(n) 扫描 movers 数组 */
  const base = lastMoverTs;
  (list||[]).forEach(e=>{
    if (pushItem(e)){
      added++;
      /* ★ 价格快照：异动被检测到时立即记录当时价格，之后永远不变 */
      if (e._snapPrice === undefined){
        const p = priceMap[e.symbol];
        if (p !== undefined){
          e._snapPrice = p;   // 价格表有则直接快照
        } else {
          e._snapPrice = null;   // 价格表没有则异步补查一次(只查一次)
          fetchPrice(e.symbol).then(pp=>{
            if (isFinite(pp)){ e._snapPrice = pp; scheduleRender(); }
          });
        }
      }
      if (cat[2](e) && periodMatch(e) && typeof e.createTimestamp === "number" && e.createTimestamp > base){
        newMatch++;
      }
      /* 收集新增的 5M 大异动用于飞书推送(初始拉取 silent=true 不推历史) */
      if (isBig5m(e) && feishuOn && !silent) new5m.push(e);
      /* 本轮新增的 5M 大异动 → 用 zzz 铃声(与飞书开关无关) */
      if (isBig5m(e) && !silent) newBig5 = true;
      /* 5M 大异动：异步计算异动时刻价格(K线精确值)，promise 存到对象上供 sendFeishu 复用 */
      if (isBig5m(e) && e._moverPrice === undefined){
        e._moverPrice = null;
        e._moverPriceP = fetchMoverPrice(e.symbol, e.openTime, e.priceChange).then(p=>{
          if (isFinite(p)) e._moverPrice = p;
          return p;
        });
        e._moverPriceP.then(()=>{ scheduleRender(); }).catch(()=>{});
      }
    }
  });
  /* 仅在有新增时才排序+裁剪(无新增时数组已是有序的)，减少每轮无谓 sort 开销 */
  if (added && movers.length){
    movers.sort((a,b)=>b.createTimestamp - a.createTimestamp);
    if (movers.length > MAX_ITEMS) movers = movers.slice(0, MAX_ITEMS);
  }
  if (added){
    if (!isRankMode()) scheduleRender();   // 用防抖合并 WS+REST 多源快速连发，避免无谓 DOM 重建
    /* 铃声: 5M大异动无条件响zzz(不受当前筛选/普通计数门控, 否则筛选下会漏); 否则有普通新异动响aa */
    if (!silent && !isRankMode()){
      if (newBig5) playBig();
      else if (newMatch > 0) playNormal();
    }
  }
  if (new5m.length) sendFeishu(new5m).catch(e=>{   /* ★第九轮③: 顶层 catch——sendFeishu 内 reject 不再中断, footer 推送状态不卡死 */
    markPush(false);
    console.warn("[飞书] sendFeishu 顶层异常", e);
  });
  if (movers.length){
    const top = movers[0].createTimestamp;
    if (typeof top === "number" && isFinite(top)) lastMoverTs = top;
    /* ★第十一轮P2⑨: REST 到数据≠链路健康——双腿 WS 全断时 30s 校准/兑底 REST 仍能取到数据,
       旧版无条件 live 会把 footer 刷成假绿掩盖断线; 状态看 WS 实际存活(WS onopen/onclose 处写真实态) */
    setStatus((wsAlive || ws2Alive) ? "live" : "err");
  }
  return added;
}

/* ---------- REST(兜底数据源, fapi 双域自动切换) ---------- */
async function restFetch(){
  const data = await fapi("/fapi/v1/topMovers");
  return Array.isArray(data) ? data : [];
}
let restBusy = false;      // REST 并发防重
let restAttempt = 0;
let restQueued = null;    // busy 期间的待补跑请求(静默性, 非静默优先); 旧版直接吞掉并发调用, 切回前台那次最急的刷新会被在跑的30s校准丢掉(最坏延时30s+)
/* REST 拉取(兜底数据源)，WS 实时流为主：
   先刷价格表再入库(快照价格准确)；返回完整 promise 链，restBusy 在链跑完才释放；
   busy 中新来的调用不再丢弃, 排队在当前链结束后立即补跑(校准/前台恢复/onopen 补拉三者互不丢失)。
   silent=true：启动/断线补偿，静音不推历史，失败按 REST_RETRY_MS 退避重试(空数据视为失败)；
   silent=false：30s 定时校准，失败静默等下一轮。 */
function fetchMovers(silent){
  if (restBusy){ restQueued = (restQueued === false) ? false : silent; return; }
  restQueued = null;
  restBusy = true;
  restFetch().then(list=>{
    if (!Array.isArray(list) || !list.length) throw new Error("empty");   // 空数据按失败退避(启动期服务端冷数据不是正常态)
    restAttempt = 0;
    return refreshPrices().then(()=>{ ingestAll(list, silent); });
  }).catch(()=>{
    if (silent){
      restAttempt++;
      setTimeout(()=>fetchMovers(true), REST_RETRY_MS * Math.min(restAttempt, 5));
    }
  }).finally(()=>{
    restBusy = false;
    if (restQueued !== null){ const q = restQueued; restQueued = null; setTimeout(()=>fetchMovers(q), 0); }
  });
}

/* ---------- WebSocket 实时(保活心跳 + topMovers 实时异动流) ---------- */
/* topMovers 在市场安静时长时间无推送, 会被服务端当空闲连接断开。
   同一连接加订 btcusdt@aggTrade 保活流(每秒都有消息);
   watchdog: 超过60秒无任何消息判定连接已死, 主动重连。 */
const WATCHDOG_MS = 45000;   // 静默断连发现时间: 45s(aggTrade 每秒保活, 正常时秒级更新, 空窗即判死)
let ws = null;
let wsConnecting = false;   /* ★第十一轮⑥(2026-10-29): ws 连接中防重入标志——CONNECTING 期 !wsAlive 仍为 false,
   visibilitychange/watchdog 可并发再调 connectWS, 旧 ws 被覆盖=孤儿连接+事件错向; connectWS 入口挡、三处 on* 复位 */
/* ★ WS topMovers 批量入库：200ms 内的推送合并为一批，避免高频逐条触发 render/推送 */
let wsBuffer = [];
let wsBufferTimer = null;
function wsIngest(mover){
  if (!mover.symbol || !mover.eventType || !mover.createTimestamp) return;
  wsBuffer.push(mover);
  if (!wsBufferTimer){
    wsBufferTimer = setTimeout(()=>{
      wsBufferTimer = null;
      const batch = wsBuffer;
      wsBuffer = [];
      ingestAll(batch, false);   // silent=false: 实时新异动 → 响声提示+飞书推送
    }, 200);
  }
}
function connectWS(){
  /* ★第十一轮⑥: CONNECTING 防重入(见声明处注释) */
  if (wsConnecting) return;
  wsConnecting = true;
  try{ if (ws) { ws.onclose = null; ws.close(); } }catch(_){}
  ws = new WebSocket(WS_BASES[wsBaseIdx]);
  const officialLeg = WS_BASES[wsBaseIdx] === "wss://fstream.binance.com/stream";
  ws.onopen = ()=>{
    wsConnecting = false;   /* ★第十一轮⑥: 复位防重入 */
    wsAlive = true;
    lastMsgTime = Date.now();
    /* 订阅实时流: 镜像腿=私有topMovers异动流+aggTrade保活+kline插针流;
       官方腿(VPN/代理环境实测可达)无topMovers私有流——带上会被官方以非法流名拒绝整个SUBSCRIBE, 连上却零数据;
       故官方腿只订标准流(aggTrade保活+kline), 插针监测不受影响, 仅异动流暂停。 */
    const params = ["btcusdt@aggTrade", ...Array.from(pinStreams)];
    if (!officialLeg) params.unshift("topMovers");
    ws.send(JSON.stringify({method:"SUBSCRIBE", params, id:1}));
    setStatus("live");
    fetchMovers(true);   // ★ 无条件补拉: 断线期间漏掉的异动立即用 REST 找回(静默不响铃), restBusy+排队机制保证与 30s 校准/前台恢复互不丢失
    schedulePinRepair();   // ★ 同时用 REST K线修复断线窗口(内部节流, 与副连接互不干扰) */
  };
  ws.onmessage = ev=>{
    lastMsgTime = Date.now();   // 保活心跳
    if (failCount) failCount = 0;
    /* ★ 实时解析 topMovers 推送(WS 短字段→REST 长字段映射) */
    try{
      const msg = JSON.parse(ev.data);
      if (msg && msg.stream === "topMovers" && msg.data){
        const d = msg.data;
        wsIngest({
          id: d.i,
          createTimestamp: d.c || d.E,
          eventType: d.e,
          noticeType: d.n,
          period: d.P || "",
          openTime: d.o,
          priceChange: d.p,
          symbol: d.s,
        });
      }
      /* ★ 插针监测: 1m kline 标准流(未收盘K线每秒推送一次) */
      else if (msg && msg.stream && msg.stream.endsWith("@kline_1m") && msg.data && msg.data.k){
        pinOnKline(msg.data.s, msg.data.k);
      }
    }catch(_){}
  };
    ws.onclose = ()=>{
      wsConnecting = false;   /* ★第十一轮⑥: 复位防重入(onerror 路径由 close 事件兑底) */
      wsAlive = false;
      setStatus("err");
      failCount = Math.min(failCount + 1, 5);
      /* 连续2次失败切换下一个候选域(镜像→官方), 不让坏域粘死；
         ★第八轮②(2026-10-29): 重置为 1 而非 0——旧版 0 使 delay 数组取[-1]=undefined⇒setTimeout 最小延迟立即重连,
         两域同时不可用时演成快速重连循环连打镜像+官方。 */
      if (failCount >= 2){ wsBaseIdx = (wsBaseIdx + 1) % WS_BASES.length; failCount = 1; }
      const delay = [3000, 6000, 12000, 24000, 30000][Math.min(failCount-1, 4)];
      setTimeout(()=>{ if (!wsAlive) connectWS(); }, delay);
    };
  ws.onerror = ()=>{ wsConnecting = false; try{ ws.close(); }catch(_){} };
}

/* ---------- Bitget 二源连接(第二数据腿, 2026-10-28): 异构源独立推 1m K线 ----------
   实测: www.bitget.cloud 域内 wss://stream.bitget.cloud/public/v1/stream 国内可达, 无 Origin 白名单,
   从 127.0.0.1 页面可直接连。v2 协议(对象args): 订阅 candle1m/mc/合约名;
   snapshot→约300根历史(含最后一根进行中, 归 pending); update ts 前移⇒上一根收盘。
   与币安腿共用 pinOnKline 入口(同根 t 去重, 收盘入库双保险), 事件/铃声/视图零改变。 */
let ws2 = null, ws2Alive = false, lastMsg2Time = 0, fail2Count = 0, ws2PingTimer = null, ws2Connecting = false;   /* ★第十一轮⑥: 副连接防重入(同 connectWS 版) */
const bitgetPending = new Map();   // sym -> 进行中根(Bitget侧收盘识别用)
const bgArgsOf = syms => syms.map(s=>({channel:"candle1m", instType:"mc", instId:s.split("@")[0].toUpperCase()}));
/* Bitget 行适配入口: snapshot(历史批量) / update(实时增量) */
function bitgetOnCandle(sym, msg){
  const rows = Array.isArray(msg.data) ? msg.data : [];
  if (!rows.length || !sym) return;
  if (msg.action === "snapshot"){
    /* 历史批量: 最后一根=进行中(归 pending), 其余合并入 bars(去重+排序)
       首次拿到深历史(≥60根)时做一次性回放找针(与币安通道跨机制去重, 静默) */
    const st = pinEnsureState(sym);
    const all = rows.map(k=>({t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4], v:+k[5]}))
                    .filter(b=>b.t>0 && b.c>0);
    if (all.length < 2) return;
    const closed = all.slice(0, -1);
    bitgetPending.set(sym, {...all[all.length-1]});   // 当前分钟进行中根
    if (closed.length){
      const have = new Set(st.bars.map(b=>b.t));
      const fresh = closed.filter(b=>!have.has(b.t));
      if (fresh.length){
        st.bars = st.bars.concat(fresh).sort((a,b)=>a.t-b.t).slice(-PIN_BARS_KEEP);
        st.atr = calcATR(st.bars);
      }
    }
    if (!st._bgInit){
      st._bgInit = true;   // 每 symbol 只做一次回放(防 5min 重估时的 snapshot 重复回放)
      if (closed.length >= 60) pinReplay(sym, st, closed);
      else if (closed.length >= 8) pinCheck(sym, st, closed[closed.length-1].t, closed[closed.length-1].o, closed[closed.length-1].h, closed[closed.length-1].l, closed[closed.length-1].c, closed[closed.length-1].v, true);
    }
    return;
  }
  /* update: 未收盘根实时状态 —— ts 前移⇒上一根收盘(正式入库+ATR), 当前根继续 tick 检测 */
  for (const r of rows){
    const t = +r[0], o = +r[1], h = +r[2], l = +r[3], c = +r[4], v = +r[5];
    if (!(t > 0 && c > 0)) continue;
    const pb = bitgetPending.get(sym);
    if (pb && t > pb.t){
      pinOnKline(sym, {t:pb.t, o:pb.o, h:pb.h, l:pb.l, c:pb.c, v:pb.v, x:true});   // 上一根收盘
      bitgetPending.delete(sym);
    }
    if (!pb || t > pb.t) bitgetPending.set(sym, {t, o, h, l, c, v});
    else if (t === pb.t){ pb.o=o; pb.h=h; pb.l=l; pb.c=c; pb.v=v; }
    else continue;
    pinOnKline(sym, {t, o, h, l, c, v, x:false});   // 当前未收盘根 tick 检测(与币安腿同根幂等)
  }
  /* ★ snapshot 迟到时 update 先到(2026-10-28): 首个 update 帧时若引擎对该币仍零数据,\n     直接以这根作为进行中根起点(不再白等 1-2 分钟批量 snapshot), 后续 snapshot 到达后仅做增量合并(去重)。 */
  const stU = pinState.get(sym);
  if (stU && !stU._bgInit && !stU.bars.length){
    stU._bgInit = true;   // 防随后的 snapshot 触发深回放(数据已由 REST/币安腿补齐过或仅数根, 不够回放样本)
  }
}
function connectWS2(){
  /* ★第十一轮⑥: CONNECTING 防重入(副连接版, 见 connectWS 声明处注释) */
  if (ws2Connecting) return;
  ws2Connecting = true;
  try{ if (ws2) { ws2.onclose = null; ws2.close(); } }catch(_){}
  if (ws2PingTimer){ clearInterval(ws2PingTimer); ws2PingTimer = null; }
  ws2 = new WebSocket(BG_WS_URL);
  ws2.onopen = ()=>{
    ws2Connecting = false;   /* ★第十一轮⑥: 复位防重入 */
    ws2Alive = true;
    lastMsg2Time = Date.now();
    if (pinStreams.size) ws2.send(JSON.stringify({op:"subscribe", args:bgArgsOf(Array.from(pinStreams))}));
    ws2PingTimer = setInterval(()=>{ try{ if (ws2 && ws2.readyState === 1) ws2.send("{\"op\":\"ping\"}"); }catch(_){} }, 25000);   // Bitget 要求≤30s心跳
    /* 重连立即查缺口(不只靠 ws2 自身 snapshot 的 1-2 分钟批量推送, 缺谁补谁, 最快路径是 REST) */
    schedulePinRepair();
  };
  ws2.onmessage = ev=>{
    lastMsg2Time = Date.now();
    try{
      const m = JSON.parse(ev.data);
      if (m && m.arg && m.arg.instType === "mc" && m.arg.channel && m.arg.channel.startsWith("candle")){
        bitgetOnCandle(m.arg.instId, m);   // data 数组格式 [ts,o,h,l,c,v,quoteVol,quoteVol]
      }
      /* 行情外的 pong/event 忽略(仅刷 lastMsg2Time 保活) */
    }catch(_){}
  };
  ws2.onclose = ()=>{
    ws2Connecting = false;   /* ★第十一轮⑥: 复位防重入(错误路径由 close 兑底) */
    ws2Alive = false;
    if (ws2PingTimer){ clearInterval(ws2PingTimer); ws2PingTimer = null; }
    fail2Count = Math.min(fail2Count + 1, 5);
    const delay = [3000, 6000, 12000, 24000, 30000][Math.min(fail2Count-1, 4)];
    setTimeout(()=>{ if (!ws2Alive) connectWS2(); }, delay);
  };
  ws2.onerror = ()=>{ ws2Connecting = false; try{ ws2.close(); }catch(_){} };
}

/* ---------- REST 断线窗口修复(第三数据腿, 2026-10-28): 双 WS 不通时段用 K线 REST 补根 ----------
   触发: 主/副连接重连成功时 + 页面重开(pinBoot)。修复只补"缺口": 先扫描各币 bars 与当前时间的空档,
   仅对有缺口的币拉 REST(比旧版全池拉快得多);
   节流 60s 一轮, 但"重冷启动"(页面重开/双腿同时恢复)时立即执行并跳过节流(旧版要等下一轮, 白白多等 60s)。 */
let pinRepairTs = 0, pinRepairing = false;
function schedulePinRepair(force){
  if (pinRepairing) return;
  if (!force && Date.now() - pinRepairTs < 60000) return;   // 普通触发: 60s 节流
  pinRepairTs = Date.now();
  pinRepairing = true;
  const now = Math.floor(Date.now()/60000)*60000;    // 当前分钟的整点
  const gaps = [];                                   // 有缺口的币
  for (const s of pinStreams){
    const sym = s.split("@")[0].toUpperCase();
    const st = pinState.get(sym);
    if (!st || !st.bars.length){ gaps.push(sym); continue; }   // 无数据=全补
    const mx = Math.max(...st.bars.map(b=>b.t));
    if (now - mx > 3*60000) gaps.push(sym);                   // 比当前分钟老 3 分钟以上=有缺口
  }
  (async ()=>{
    for (let i = 0; i < gaps.length; i += 6){
      gaps.slice(i, i+6).forEach(s=>pinInitHistory(s));
      if (i + 6 < gaps.length) await new Promise(r=>setTimeout(r, 300));
    }
    pinRepairing = false;
    if (gaps.length && curView === "pin") scheduleRender();
  })();
}

/* ---------- 24H 合约涨跌幅榜(与价格表合流共用同一拉取: 每轮只拉一次全量 ticker) ---------- */
const RANK_SIZE    = 20;        // 每榜条数
const RANK_MIN_VOL = 1e6;       // 24H成交额门槛 $100万, 过滤无量刷榜小币

/* 只保留 USDT 本位永续: 排除交割合约(如 BTCUSDT_250926)、USDC 结算对、非标符号(如"龙虾USDT")、股票杠杆代币(CSOP前缀) */
const RANK_RE = /^[A-Z0-9]+USDT$/, CSOP_RE = /^CSOP/;
/* 榜单与价格表同源合流: 直接用 refreshPrices 已写入的 volMap/priceMap/chgMap 构造,
   数据 >15s 旧才补拉一次(消除旧版 fetchRank 与 refreshPrices 每轮重复拉全量 ticker 的双倍流量) */
async function fetchRank(){
  if (Date.now() - priceTs > 15000) await refreshPrices();
  if (!priceTs) return false;
  const pool = Object.keys(volMap)
    .filter(s=>RANK_RE.test(s) && !CSOP_RE.test(s) && typeof volMap[s] === "number" && volMap[s] >= RANK_MIN_VOL);
  if (!pool.length) return false;
  const rows = pool.map(s=>({ symbol:s, last:priceMap[s]||0, vol:volMap[s], pct:chgMap[s]||0 }));
  rows.sort((a,b)=>b.pct - a.pct);
  rankRows.up = rows.slice(0, RANK_SIZE);
  rankRows.down = rows.slice(-RANK_SIZE).reverse();   // 最惨在前
  rankTs = Date.now();
  return true;
}
function fmtVol(v){   // 成交额中文单位: 亿/万, 200M -> 2亿
  if (!isFinite(v) || v < 0) return "—";
  if (v >= 99995000){   /* ★第十一轮P3: 旧界 1e8 使 99,999,500~99,999,999 的万位 toFixed(1) 进位显示"10000万"
      (99,999,999→"10000万"视觉断裂); 亿位 toFixed(2) 在 99,995,000(=0.99995亿)起已显示"1.00亿",
      锚点前移到 99,995,000, 万/亿两界不再打架 */
    const y = v / 1e8;
    return parseFloat(y.toFixed(2)) + "亿";
  }
  if (v >= 1e4){
    const w = v / 1e4;
    return parseFloat(w.toFixed(1)) + "万";
  }
  return String(Math.round(v));
}
/* 榜单行节点：复用 .item 条幅布局，前三名奖牌/其余名次徽标，红涨绿跌 */
function rankItemNode(r, i){

function loadPinEvents(){   // 恢复当天: 旧黄卡超时转灰, 全部标回放(不重复响铃/角标/自证/推送)
